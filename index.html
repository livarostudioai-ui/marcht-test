<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14532d">
<title>TCCC — тест на 500 питань</title>
<style>
:root{--bg:#f4f5f2;--card:#fff;--ink:#1c1f1a;--mute:#5d6559;--line:#d9ddd4;--acc:#2f6b3a;--accink:#fff;
--ok:#1f7a3a;--okbg:#e2f4e6;--bad:#b3261e;--badbg:#fbe6e4;--warn:#8a5a00}
@media (prefers-color-scheme:dark){:root{--bg:#121512;--card:#1c211c;--ink:#e8ece5;--mute:#9aa496;--line:#2f372e;--acc:#5fae6c;--accink:#0d1a0f;
--ok:#6fd187;--okbg:#17321e;--bad:#ff8b82;--badbg:#3a1a18;--warn:#e0b04a}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:17px;line-height:1.4}
body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
button{font:inherit;color:inherit;touch-action:manipulation;cursor:pointer}
.wrap{max-width:720px;margin:0 auto;padding:16px 16px 110px}
h1{font-size:1.45rem;margin:8px 0 4px}
.sub{color:var(--mute);margin:0 0 16px;font-size:.95rem}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.panel h2{font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);margin:0 0 10px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.stats b{display:block;font-size:1.5rem}.stats span{font-size:.8rem;color:var(--mute)}
.seg{display:grid;gap:8px}
.opt{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;padding:12px 14px;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:14px}
.opt .k{flex:0 0 32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:700;background:var(--bg);border:1px solid var(--line)}
.opt .t{flex:1}
.opt.sel{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 12%,var(--card))}
.opt.ok{border-color:var(--ok);background:var(--okbg)}.opt.ok .k{background:var(--ok);color:#fff;border-color:var(--ok)}
.opt.bad{border-color:var(--bad);background:var(--badbg)}.opt.bad .k{background:var(--bad);color:#fff;border-color:var(--bad)}
.opt.dim{opacity:.55}
.opt:disabled{cursor:default}
select{width:100%;min-height:52px;font:inherit;padding:10px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.chip{flex:1 1 0;min-width:70px;min-height:48px;border:2px solid var(--line);background:var(--card);border-radius:12px;padding:8px}
.chip.on{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 14%,var(--card));font-weight:700}
.btn{display:block;width:100%;min-height:56px;border:0;border-radius:14px;background:var(--acc);color:var(--accink);font-weight:700;font-size:1.05rem;padding:12px}
.btn.sec{background:var(--card);color:var(--ink);border:2px solid var(--line);font-weight:600}
.top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.top .x{min-height:44px;min-width:44px;border-radius:12px;border:2px solid var(--line);background:var(--card)}
.bar{flex:1;height:10px;border-radius:6px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;background:var(--acc);width:0}
.cnt{font-size:.9rem;color:var(--mute);white-space:nowrap}
.tags{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;font-size:.8rem;color:var(--mute)}
.tag{padding:3px 10px;border-radius:999px;border:1px solid var(--line);background:var(--card)}
.q{font-size:1.18rem;font-weight:600;margin:6px 0 14px}
.fb{margin-top:14px;padding:14px;border-radius:14px;border:2px solid}
.fb.ok{border-color:var(--ok);background:var(--okbg)}.fb.bad{border-color:var(--bad);background:var(--badbg)}
.fb h3{margin:0 0 6px;font-size:1.1rem}.fb p{margin:6px 0}
.dock{position:fixed;left:0;right:0;bottom:0;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 30%)}
.dock .in{max-width:720px;margin:0 auto}
.big{font-size:2.6rem;font-weight:800;text-align:center;margin:10px 0}
.tbl{width:100%;border-collapse:collapse;font-size:.95rem}.tbl td{padding:7px 4px;border-top:1px solid var(--line)}.tbl td:last-child{text-align:right;white-space:nowrap}
.hide{display:none}
small.hint{color:var(--mute)}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
"use strict";
const Q = [{"m":"06","d":1,"q":"Що означає літера M в алгоритмі MARCH?","c":"Massive hemorrhage — масивна кровотеча","w":["Medication — введення ліків","Monitoring — моніторинг пульсу","Movement — евакуація"],"e":"M — це Massive hemorrhage. Масивна кровотеча вбиває найшвидше, тому вона перша в алгоритмі."},{"m":"06","d":1,"q":"Які три фази надання допомоги виділяє TCCC?","c":"Допомога під вогнем (CUF), допомога в польових умовах (TFC), допомога на етапі тактичної евакуації (TACEVAC)","w":["Первинна допомога, лікарська допомога та спеціалізована допомога в стаціонарі","Допомога під обстрілом, допомога в укритті, допомога в тилу на пункті збору","Бій, відхід, відновлення"],"e":"Три фази TCCC: CUF — під вогнем/під загрозою, TFC — в польових умовах, TACEVAC — на етапі тактичної евакуації."},{"m":"06","d":1,"q":"У яких фазах TCCC проводиться зупинка масивної кровотечі?","c":"У всіх трьох фазах","w":["Лише під вогнем (CUF)","Лише в польових умовах (TFC)","Лише під час евакуації (TACEVAC)"],"e":"Зупинка масивної кровотечі охоплює всі фази TCCC — вона завжди пріоритет."},{"m":"06","d":1,"q":"Яка ознака вказує на кровотечу, що загрожує життю?","c":"Яскраво-червона кров, що пульсує або безперервно витікає з рани","w":["Невелике садно з кіркою","Темна кров, що сочиться краплями з подряпини","Синець без пошкодження шкіри"],"e":"Небезпечна кровотеча: яскраво-червона кров, пульсація, розтікання по землі, просякнутий кров'ю одяг, пов'язки, що швидко промокають, травматична ампутація."},{"m":"06","d":1,"q":"Яка з ознак НЕ належить до ознак небезпечної для життя кровотечі?","c":"Невелика подряпина без кровотечі","w":["Травматична ампутація","Верхній одяг просякнутий кров'ю","Бинти, що поступово промокають кров'ю"],"e":"Подряпина без кровотечі небезпеки для життя не становить. Решта варіантів — прямі ознаки масивної кровотечі."},{"m":"06","d":1,"q":"Які три типи кровоносних судин є в організмі?","c":"Артерії, вени, капіляри","w":["Аорта, серце, легені","Артерії, лімфатичні судини, нерви","Вени, м'язи, сухожилля"],"e":"Три типи судин: артерії, вени і капіляри. Серце — це м'яз, який перекачує кров."},{"m":"06","d":1,"q":"Що потрібно зробити з пораненим під вогнем, який може рухатися?","c":"Наказати відкрити вогонь у відповідь, перейти в укриття й надати собі допомогу","w":["Залишитися на місці, зупинити вогонь противника й чекати санітара","Накласти бинт на рану прямо під обстрілом і почати оцінку дихання","Одразу почати інфузію"],"e":"У CUF боєздатний поранений відкриває вогонь, іде в укриття й виконує самодопомогу, наприклад накладає турнікет."},{"m":"06","d":1,"q":"Як накладається турнікет у фазі допомоги під вогнем (CUF)?","c":"«Високо і туго» поверх одягу над раною","w":["На 5-8 см вище рани прямо на шкіру","Нижче рани, ближче до стопи","Лише після розрізання одягу"],"e":"У CUF діє принцип «високо і туго» — швидко, без роздягання. Прицільний турнікет на 5-8 см на шкіру — це вже фаза TFC."},{"m":"06","d":1,"q":"Який турнікет слід використати першим для постраждалого, що без свідомості?","c":"Турнікет із його власної індивідуальної аптечки (JFAK)","w":["Турнікет із аптечки рятівника, а турнікет пораненого залишити для нього","Імпровізований турнікет із ременя, щоб зберегти штатні","Імпровізований турнікет"],"e":"Спочатку використовують турнікет самого пораненого з його індивідуальної аптечки: це зберігає ваші ресурси, а його турнікет вам знайомий і доступний."},{"m":"06","d":2,"q":"На якій відстані від рани накладають прицільний турнікет у фазі TFC?","c":"5-8 см вище рани, прямо на шкіру","w":["1-2 см вище рани поверх одягу","15-20 см вище рани","Прямо на рану"],"e":"У TFC турнікет накладають свідомо (прицільно): 5-8 см проксимальніше кровотечі на шкіру. Занадто близько до рани не можна, занадто високо — втрачається життєздатна тканина."},{"m":"06","d":2,"q":"Яка головна відмінність між турнікетом у CUF та у TFC?","c":"У CUF — «високо і туго» поверх одягу, у TFC — прицільно 5-8 см над раною на шкіру","w":["У CUF турнікет накладається на шкіру, у TFC — поверх одягу","Різниці немає","У TFC турнікет не використовують"],"e":"У CUF важлива швидкість і безпека, тому турнікет накладають високо, навіть поверх одягу. У TFC є час, тому його ставлять прицільно, на шкіру, 5-8 см вище рани."},{"m":"06","d":2,"q":"Як оцінити ефективність турнікета?","c":"Перевірити, що кровотеча зупинилася і відсутній пульс дистальніше турнікета","w":["Перевірити, що шкіра нижче турнікета стала червоною","Переконатися, що поранений не скаржиться на біль","Послабити турнікет і подивитися"],"e":"Ефективний турнікет: кровотеча зупинена і дистальний пульс відсутній."},{"m":"06","d":2,"q":"Що робити, якщо турнікет, накладений у CUF, виявився неефективним у TFC?","c":"Оцінити, застосувати прямий тиск і накласти прицільний турнікет на 5-8 см над раною на шкіру","w":["Нічого не змінювати, бо турнікет із CUF завжди вважається остаточним","Зняти турнікет і замінити на тиснучу пов'язку без оцінки кровотечі","Нічого, залишити як є"],"e":"Неефективний турнікет — привід діяти: оцінити, притиснути рану і накласти прицільний турнікет на 5-8 см вище рани прямо на шкіру."},{"m":"06","d":2,"q":"Що робити, якщо перший турнікет залишився неефективним при повторній оцінці?","c":"Накласти другий турнікет поруч із першим","w":["Зняти перший і чекати","Послабити перший турнікет","Накласти турнікет нижче на стопу"],"e":"При неефективному турнікеті накладають другий поруч (вище) першого, не знімаючи перший."},{"m":"06","d":2,"q":"Який маневр виконують після зупинки видимої масивної кровотечі, щоб не пропустити приховані джерела?","c":"«Витягування» (sweep): перевірити шию, пахви, пах, ноги і руки","w":["Лише оглянути голову й кінцівки та повторно виміряти температуру тіла","Повернути пораненого на живіт і оглянути лише спину","Огляд лише спини"],"e":"Після видимої кровотечі перевіряють шию, пахвові ділянки, пах, а також ноги й руки — шукають невиявлені кровотечі."},{"m":"06","d":1,"q":"Для чого використовують прямий тиск при масивній кровотечі?","c":"Як тимчасовий захід до накладання турнікета чи пов'язки","w":["Як остаточний спосіб зупинки будь-якої кровотечі","Лише при венозних кровотечах","Не використовують зовсім"],"e":"Прямий тиск — тимчасовий захід до накладання турнікета або пов'язки. Він малоефективний при значній кровотечі чи під час переміщення пораненого."},{"m":"06","d":2,"q":"Як працює непрямий тиск для зупинки кровотечі?","c":"Тиск на відповідну артерію проксимальніше (вище) місця кровотечі","w":["Тиск безпосередньо в рану на глибину кісткового фрагмента","Тиск на вену дистальніше (нижче) місця кровотечі","Охолодження рани"],"e":"Непрямий тиск стискає артерію проксимальніше рани (плечова, пахова, стегнова точки). Це тимчасовий метод і потребує підготовки."},{"m":"06","d":2,"q":"Яка мінімальна ширина матеріалу для імпровізованого турнікета?","c":"5 см","w":["1 см","2 см","Ширина не має значення"],"e":"Матеріал ≥5 см. Вузькі стрічки (<5 см) ушкоджують шкіру й неефективно стискають судини."},{"m":"06","d":2,"q":"Які ризики пов'язані з імпровізованими турнікетами?","c":"Кровотеча може погіршитися, ушкодження шкіри, ослаблення з часом","w":["Ризиків немає, якщо турнікет затягнуто руками якнайсильніше","Лише ризик алергії на матеріал та незначний біль під час накладання","Ризиків немає"],"e":"Імпровізований турнікет може не зупинити кровотечу повністю, ушкодити шкіру, а якщо погано закріплений — послабитися."},{"m":"06","d":2,"q":"Що необхідно для правильного імпровізованого турнікета?","c":"Матеріал ≥5 см, міцний вороток і кріплення, що не дасть воротку послабитися","w":["Вузька стрічка до 2 см без воротка, зав'язана подвійним вузлом","Будь-яка тканина, що тримається навіть без воротка та закріплення","Бинт без закріплення"],"e":"Підходить: ширина ≥5 см, міцний вороток, фіксація воротка. Без воротка або з вузьким матеріалом — не підходить."},{"m":"06","d":1,"q":"Де розташовані вузлові (юнкціональні) зони?","c":"У місцях з'єднання кінцівок і шиї з тулубом: шия, пахви, пах","w":["Лише на кистях і стопах, у місцях, де не можна накласти турнікет","На рівні ліктьового та колінного суглобів, де судини найбільші","Лише на стопах"],"e":"Вузлові зони: шия, пахвові ділянки і пах — там, де кінцівки та шия з'єднуються з тулубом."},{"m":"06","d":2,"q":"Чому вузлову кровотечу не можна зупинити звичайним турнікетом на кінцівці?","c":"Місце уражене зверху на тулубі/шиї, де кінцівковий турнікет не може бути ефективно накладений","w":["Бо там немає великих судин і кровотеча завжди зупиняється сама","Бо турнікет на тулубі завжди ефективний, але дуже болючий","Бо там немає судин"],"e":"Вузлові зони розташовані там, де турнікет на кінцівці накласти неможливо. Судини тут більші, але їх можна стиснути прямим тиском, гемостатичним бинтом чи вузловим турнікетом."},{"m":"06","d":3,"q":"Чому верхня частина стегна й пах особливо вразливі на полі бою?","c":"Ці ділянки не захищені бронею","w":["Там немає м'язів","Там поверхневі кістки","Це випадковість"],"e":"Верхня частина стегна й пах не закриті бронежилетом і часто уражаються осколками, тому вузлові кровотечі там поширені."},{"m":"06","d":2,"q":"Коли застосовують гемостатичний бинт, рекомендований CoTCCC?","c":"Коли турнікет неможливо накласти, його немає, або кровотеча з рани не потребує турнікета","w":["Тільки при подряпинах і дрібних порізах без значної кровотечі","Лише коли турнікет уже накладено й кровотеча повністю зупинена","Лише при опіках"],"e":"Гемостатичний бинт — для зовнішніх кровотеч, що зупиняються тиском, коли кінцівковий турнікет не застосовується (вузлові зони), недоступний або не потрібний."},{"m":"06","d":2,"q":"Як довго утримують прямий тиск після тампонування рани гемостатичним бинтом?","c":"Щонайменше 3 хвилини","w":["10 секунд","30 секунд","Не потрібно тримати"],"e":"Утримуйте тиск щонайменше 3 хв — навіть якщо в бинті є активна речовина."},{"m":"06","d":2,"q":"Яка послідовність дій при тампонуванні рани?","c":"Знайти джерело, прямий тиск, щільно затампонувати, тримати тиск ≥3 хв, перевірити, накласти компресійний бандаж","w":["Накласти бандаж, потім затампонувати, тиснути 10 секунд, результат не перевіряти","Промити рану водою, залишити відкритою та чекати природної зупинки","Лише притиснути пальцем 5 с"],"e":"Алгоритм: визначити джерело, застосувати прямий тиск, щільно затампонувати, утримувати ≥3 хв, оцінити результат і лише тоді накласти компресійний бандаж."},{"m":"06","d":3,"q":"Що робити, якщо рана, затампонована гемостатичним бинтом, продовжує кровоточити?","c":"Вийняти бинт і затампонувати новим гемостатичним (якщо є) або додати поверх негемостатичний бинт","w":["Нічого не змінювати й залишити бинт, чекаючи самостійної зупинки кровотечі","Зняти бинт, залити рану водою й накласти тонку суху пов'язку без тиску","Нічого не робити"],"e":"Якщо тампонада неефективна — повторно затампонувати новим гемостатиком. Альтернатива: додати поверх негемостатичний бинт."},{"m":"06","d":2,"q":"Як зупиняють вузлову кровотечу в ділянці шиї?","c":"Затампонувати гемостатичним бинтом, сильно тиснути руками 3 хв, зафіксувати бинтом діагонально навколо грудної клітки під протилежною пахвою","w":["Накласти турнікет на шию та туго затягнути, щоб зупинити кровотік","Затягнути бинт кільцем навколо шиї, зафіксувавши лише на потилиці","Лише притиснути на 10 с"],"e":"На шиї турнікет неможливий і небезпечний. Рану тампонують, тиснуть 3 хв і фіксують діагональним бинтом під протилежною пахвою, а не навколо шиї."},{"m":"06","d":2,"q":"Яким правилом слід керуватися при накладанні компресійного бандажа?","c":"Усі пов'язки при значній кровотечі закріплюють компресійними бандажами","w":["Компресійний бандаж потрібен лише на кінцівки після зняття турнікета","Компресійний бандаж замінює тампонування, тому його накладають замість нього","Бандаж замінює тампонаду"],"e":"Усі пов'язки, накладені при значній кровотечі, слід закріпити компресійним бандажем, поверх пов'язки, зберігаючи тиск."},{"m":"06","d":3,"q":"Як перевіряють, чи компресійний бандаж не занадто тугий?","c":"Пальпувати дистальний пульс; прохолодна, синюшна чи заніміла шкіра нижче бандажа — ознака надто тугої пов'язки","w":["Виміряти температуру шкіри під бандажем і порівняти колір бинта","Лише спитати пораненого, чи болить, інші ознаки не перевіряти","Дивитися, чи є запах"],"e":"Перевіряйте кровообіг нижче бандажа: пульс, колір, температуру, чутливість. Якщо бандаж діє як турнікет — послабте й знову закріпіть."},{"m":"06","d":2,"q":"Що робити, якщо тиснуча пов'язка діє як турнікет?","c":"Послабити її й знову закріпити","w":["Затягнути ще сильніше","Залишити як є","Зняти й не накладати нічого"],"e":"Занадто тугий бандаж порушує кровообіг — його послабляють, повторно закріплюють і часто переоцінюють, особливо при кожному переміщенні."},{"m":"06","d":2,"q":"Для яких ран найкраще підходить гемостатик XSTAT?","c":"Для ран із вузьким раневим ходом і ран у вузлових ділянках","w":["Для поверхневих подряпин і садон без значної кровотечі","Для ран ока та повік, де потрібно швидко закрити рану","Для опіків"],"e":"XSTAT — спресовані губки у шприці-аплікаторі; розширюються при контакті з кров'ю; найкращий для вузьких раневих ходів і вузлових зон."},{"m":"06","d":2,"q":"Що робити після введення мініпористих губок XSTAT?","c":"Притиснути рану рукою 3 хв, а потім накласти тиснучу пов'язку","w":["Одразу накласти турнікет поверх губок, не тримаючи тиск","Залишити без тиску й чекати, поки губки самі розширяться за 15 хвилин","Вийняти губки"],"e":"Після введення губок утримують ручний тиск 3 хв, оцінюють результат і накладають тиснучу пов'язку."},{"m":"06","d":2,"q":"Яке застереження стосується пристрою для закриття ран (наприклад, iTClamp)?","c":"Не використовувати близько до очей, обережно з гострим предметом","w":["Його використовують лише біля ока й обличчя для закриття повік","Його не можна поєднувати з жодними іншими методами зупинки кровотечі","Використовується лише на животі"],"e":"iTClamp не застосовують біля очей і утилізують обережно (гострий). Підходить для шкіри голови, шиї, кінцівок і деяких ран паху чи пахви, можна комбінувати з тампонуванням."},{"m":"06","d":3,"q":"Що слід зробити при застосуванні вузлового турнікета SAM, щоб він працював ефективно?","c":"Закріпити ремінь і пряжку до клацання, підтягнути провислі ділянки перед надуванням, розташувати нижче пахової зв'язки","w":["Накласти поверх броні й надувати без закріплення пряжки","Розмістити вище пупка й не фіксувати ремінь до клацання","Не надувати"],"e":"Для ефективної дії: клацання пряжки, підтягнути ремінь до надування, розмістити нижче пахової зв'язки, щоб стиснути великі судини. Час накладання документують."},{"m":"06","d":2,"q":"Що робити при двосторонніх пораненнях у вузлових ділянках (пах)?","c":"Використати другий вузловий пристрій за тією ж процедурою","w":["Накласти лише один пристрій, а другу сторону притиснути рукою","Накласти турнікет кінцівки поруч із паховою складкою замість другого пристрою","Накласти вище грудей"],"e":"При двосторонніх пораненнях використовують другий пристрій і документують час накладання."},{"m":"06","d":2,"q":"Скільки часу турнікет може залишатися без високого ризику ушкодження кінцівки?","c":"До 2 годин","w":["До 10 хвилин","До 30 хвилин","Без обмежень"],"e":"До 2 год ризик невисокий. Понад 2 год потрібна консультація медичного персоналу, понад 6 год — можлива втрата кінцівки."},{"m":"06","d":2,"q":"Що відомо про турнікет, що пробув на кінцівці понад 6 годин?","c":"Може призвести до втрати кінцівки, конверсія зазвичай не проводиться","w":["Це безпечно й навіть корисно, бо чим довше, тим краще утворюються згустки","Турнікет слід негайно зняти без контролю, інакше кінцівка відмре","Це безпечно"],"e":"Понад 6 год турнікет може призвести до втрати кінцівки; у такому випадку конверсію не проводять."},{"m":"06","d":3,"q":"Бійця поранено в ногу під обстрілом, кров б'є пульсуючим струменем, він у свідомості й може рухатися. Яка послідовність правильна?","c":"Відкрити вогонь у відповідь, перейти в укриття, накласти собі турнікет високо й туго","w":["Спершу виміряти тиск і температуру, потім накласти тампонаду під вогнем","Залишитися на місці й лікувати його повністю в зоні обстрілу","Спершу вимірювати тиск"],"e":"У CUF поранений, що може рухатися, відповідає на вогонь, іде в укриття й виконує самодопомогу — турнікет «високо і туго»."},{"m":"06","d":3,"q":"Які дії є правильними при наближенні до непритомного пораненого під вогнем?","c":"Бути уважним, щоб не збільшити кількість поранених; візуально шукати масивні кровотечі; турнікет з його JFAK","w":["Підбігти без огляду та одразу почати вентиляцію мішком Амбу","Накласти пов'язку на найближчу подряпину й швидко залишити поранених","Накласти бинт"],"e":"Підходьте обережно, аби не збільшити кількість поранених, проведіть візуальний пошук масивних кровотеч і накладіть турнікет «високо і туго»."},{"m":"06","d":2,"q":"Який пристрій призначений для стискання великих судин кінцівки, щоб зупинити кровотечу?","c":"Турнікет для кінцівок","w":["Назофарингеальний повітровід","Оклюзійна наліпка","Пульсоксиметр"],"e":"Турнікет — пристрій, що стискає великі судини (артерії та вени) кінцівки й зупиняє кровотік у ній."},{"m":"06","d":1,"q":"Яку пов'язку використовують для утримання тиску на рані поверх тампонади?","c":"Компресійний (тиснучий) бандаж","w":["Оклюзійну наліпку, бо вона надійніше тисне на кровоточиву рану","Жорсткий щиток, що притискає й захищає від ударів","Жорсткий щиток"],"e":"Компресійний бандаж накладають безпосередньо на пов'язку, зберігаючи прямий тиск."},{"m":"07","d":1,"q":"Яка найчастіша причина обструкції дихальних шляхів на полі бою?","c":"Щелепно-лицева травма","w":["Травма гомілки","Опік кисті","Перелом таза"],"e":"На полі бою обструкція часто виникає при щелепно-лицевій травмі. Також язик може перекрити дихальні шляхи в непритомного."},{"m":"07","d":1,"q":"Чому в непритомного постраждалого можуть бути порушені дихальні шляхи?","c":"Розслаблений язик западає до задньої стінки глотки","w":["Гортань завжди закривається через сильний біль у грудях","Легені заповнюються повітрям, і воно виходить через рот самостійно","Гортань завжди закривається"],"e":"У непритомного м'язи язика розслаблюються, язик опускається до задньої стінки глотки й закриває вхід до трахеї."},{"m":"07","d":1,"q":"Яка ознака може вказувати на обструкцію дихальних шляхів?","c":"Хрипи, булькаючі звуки, видима кров чи сторонні тіла в дихальних шляхах","w":["Спокійний рівномірний подих і чисте мовлення без сторонніх звуків","Рожева шкіра, повільне дихання й відсутність видимих сторонніх тіл","Рожева шкіра"],"e":"Обструкцію запідозрюють при крайньому збудженні, хрипах/булькотінні, крові чи стороннім тілі в дихальних шляхах, щелепно-лицевій травмі."},{"m":"07","d":2,"q":"Що не можна робити при видаленні стороннього тіла з ротової порожнини?","c":"Шукати сторонні тіла пальцем наосліп","w":["Видаляти видимі об'єкти й відсмоктувати рідину пристроєм","Повернути голову набік і обережно очистити рот від видимого","Відсмоктувати рідину"],"e":"Видаліть видимі об'єкти, але не шукайте пальцем наосліп — ризик проштовхнути предмет глибше."},{"m":"07","d":2,"q":"Яка тривалість одного відсмоктування з дихальних шляхів?","c":"Не більше 10 секунд","w":["1 хвилина","Скільки потрібно","30 секунд"],"e":"Аспірацію виконують не довше 10 секунд, відсмоктування — лише під час виведення катетера."},{"m":"07","d":2,"q":"Коли проводять відсмоктування під час допомоги?","c":"Лише при виведенні катетера","w":["Тільки при введенні катетера","Постійно при введенні й виведенні","Лише при вставленому NPA"],"e":"Відсмоктування виконують тільки при виведенні катетера, вводять — лише на видиму оком глибину, щоб не спровокувати блювотний рефлекс."},{"m":"07","d":2,"q":"Яка градація пристроїв для відсмоктування рекомендована?","c":"Добре — імпровізований, краще — ручний, найкраще — механічний","w":["Найкраще — імпровізований, краще — механічний, добре — ручний","Усі пристрої абсолютно рівнозначні, окрім електронних","Усі однакові"],"e":"Градація: імпровізований — добре, ручний — краще, механічний — найкраще."},{"m":"07","d":2,"q":"Яке положення обирає притомний постраждалий, що дихає самостійно?","c":"Положення, яке йому найзручніше, наприклад сидячи з нахилом уперед","w":["Лише лежачи на спині, щоб не втрачати сил на дихання","Лише у стабільному боковому положенні незалежно від самопочуття","Лише напівсидячи"],"e":"Не змушуйте змінювати положення, якщо поранений дихає в обраному; сидячи та/або з нахилом уперед допомагає тримати дихальні шляхи прохідними."},{"m":"07","d":2,"q":"Кого слід переводити у стабільне бокове положення?","c":"Непритомного без шоку або притомного, який здатний перевернутися","w":["Лише притомного в шоці, що не може самостійно перевернутися","Усіх без винятку, включно з пораненими з масивною кровотечею","Усіх без винятку"],"e":"Стабільне бокове положення — для непритомного постраждалого, що не в шоці, чи притомного, здатного перевертатися."},{"m":"07","d":2,"q":"Який маневр краще при підозрі на травму хребта для відновлення прохідності дихальних шляхів?","c":"Виведення нижньої щелепи","w":["Розгинання голови з підняттям підборіддя","Сильне закидання голови","Згинання шиї уперед"],"e":"При підозрі на ушкодження хребта надають перевагу виведенню нижньої щелепи, бо воно мінімально рухає шийний відділ."},{"m":"07","d":2,"q":"У якому випадку іммобілізація шийного відділу хребта НЕ потрібна?","c":"При ізольованій проникаючій травмі обличчя або шиї","w":["При падінні з висоти та вибуховій травмі з болем у шиї","При дорожній пригоді з ударом і порушенням чутливості кінцівок","При ДТП"],"e":"Іммобілізація не потрібна, якщо є лише проникаюча травма обличчя або шиї, без іншого механізму для хребта."},{"m":"07","d":3,"q":"Що має вищий пріоритет за відсутності ресурсів для стабілізації шиї?","c":"Забезпечення прохідності дихальних шляхів","w":["Іммобілізація шийного відділу хребта, а прохідність потім","Вимірювання тиску та пульсу, а потім дихальні шляхи","Знеболення"],"e":"Травма шиї не має вищого пріоритету, ніж прохідність дихальних шляхів, якщо немає ресурсів, щоб стабілізувати шию."},{"m":"07","d":2,"q":"Для кого підходить назофарингеальний повітровід (NPA)?","c":"Для непритомних і напівпритомних без обструкції дихальних шляхів","w":["Лише для притомних із повною обструкцією дихальних шляхів","Лише для постраждалих із травмою носа та опіками дихальних шляхів","Лише при травмі носа"],"e":"NPA застосовують у непритомних і напівпритомних постраждалих без обструкції; він добре поєднується з вентиляцією мішком Амбу."},{"m":"07","d":2,"q":"Яка правильна техніка введення NPA?","c":"Змастити, вводити під кутом 90° до обличчя (не вздовж довгої осі носа), зафіксувати пластирем","w":["Не змащувати, вводити вздовж довгої осі носа вгору й не фіксувати","Змастити, вводити під кутом 45° до обличчя, тримати лише рукою","Вводити всуху вгору"],"e":"NPA змащують, вводять під 90° до обличчя, фіксують пластирем після введення."},{"m":"07","d":3,"q":"Яке з перелічених є протипоказанням до введення NPA?","c":"Прозора рідина з носа або вух, опіки дихальних шляхів, помірна чи тяжка травма носа","w":["Непритомність і відсутність обструкції дихальних шляхів","Збережене дихання та низька сатурація без травми носа","Непритомність"],"e":"NPA не вводять при витіканні прозорої рідини з носа/вух (можливий ліквор), ознаках опіку дихальних шляхів або травмі носа помірного/тяжкого ступеня."},{"m":"07","d":2,"q":"Яке обмеження має орофарингеальний повітровід (OPA)?","c":"Не переноситься пацієнтами у свідомості","w":["Не можна використовувати з Амбу","Завжди викликає опіки","Не потрібен ніколи"],"e":"OPA застосовують лише у непритомних: притомні його не переносять (блювотний рефлекс). Протипоказання — ознаки інгаляційних опіків."},{"m":"07","d":2,"q":"Які основні показання до крікотиреотомії?","c":"Невдале відновлення прохідності іншими способами, щелепно-лицева травма з обструкцією, опіки або токсичні гази","w":["Біль у горлі, кашель і легка захриплість без обструкції","Будь-яке порушення дихання без спроб інших методів і маневрів","Кашель"],"e":"Показання: невдалі відсмоктування/маневри/NPA/OPA, щелепно-лицеві травми з обструкцією, опіки чи токсичні гази."},{"m":"07","d":2,"q":"Яке протипоказання до крікотиреотомії?","c":"Масивна травма дихальних шляхів, діти до 10 років","w":["Щелепно-лицева травма з обструкцією та опіки дихальних шляхів","Токсичні гази та невдале відсмоктування й маневри","Токсичні гази"],"e":"Протипоказання: масивна травма дихальних шляхів та діти до 10 років."},{"m":"07","d":2,"q":"Яка типова помилка при крікотиреотомії?","c":"Занадто короткий розріз і проколюючі рухи","w":["Пальпація перснещитоподібної мембрани","Знання анатомічних орієнтирів","Горизонтальний розріз по мембрані"],"e":"Не робіть розріз занадто коротким, уникайте проколюючих рухів, відпрацьовуйте орієнтири, а мембрану пальпуйте вказівним пальцем."},{"m":"07","d":2,"q":"Яку мембрану пальпують під час крікотиреотомії?","c":"Перснещитоподібну","w":["Барабанну","Плевральну","Діафрагму"],"e":"Орієнтир для горизонтального розрізу — перснещитоподібна мембрана."},{"m":"07","d":2,"q":"Яка техніка утримання маски при вентиляції Амбу, коли рятівник один?","c":"Техніка «ЕС»","w":["Двома руками з боків","Не потрібно тримати маску","Притиснути маску лобом"],"e":"Одна людина тримає маску технікою «ЕС», з помічником — двома руками."},{"m":"07","d":3,"q":"Як проводять вентиляцію мішком Амбу?","c":"Повільне стискання 1-2 с, один вдих кожні 5-6 с","w":["Швидке стискання, 1 вдих на секунду","Максимально сильне стискання","Один вдих на хвилину"],"e":"Повільне спокійне стискання 1-2 с і один вдих кожні 5-6 секунд, щоб уникнути перероздування шлунка й баротравми."},{"m":"07","d":2,"q":"Який з показів є показом до вентиляції Амбу?","c":"ЧД нижче 8/хв, SpO2 <90% при неефективному диханні, гіперкапнія >45 мм рт. ст., апное","w":["ЧД 16-20/хв, SpO2 98 % і ефективне самостійне дихання","Легкий кашель, нормальний колір шкіри й відсутність апное","SpO2 99%"],"e":"Покази: ЧД <8/хв, гіпоксія SpO2 <90% при неефективному диханні, гіперкапнія >45 мм рт. ст., апное."},{"m":"07","d":3,"q":"Постраждалий з опіками обличчя, захриплий, сажа в мокротинні. Що слід зробити в першу чергу з урахуванням підозри на інгаляційну травму?","c":"Уникати NPA/OPA, розглянути крікотиреотомію","w":["Одразу ввести NPA, щоб відновити прохідність без хірургії","Ввести OPA й чекати, не оцінюючи динаміку дихання","Ввести OPA"],"e":"При ознаках інгаляційних опіків NPA/OPA протипоказані, вони можуть бути недостатніми, тому розглядають хірургічне забезпечення дихальних шляхів (крікотиреотомію)."},{"m":"07","d":3,"q":"Які фактори обмежують забезпечення прохідності дихальних шляхів у польових умовах?","c":"Масивна травма, досвід, практичні навички, анатомічні орієнтири, підготовка, ресурси","w":["Лише погода, час доби й колір спорядження пораненого","Лише кількість поранених поруч і наявність зв'язку з тилом","Лише погода"],"e":"Обмеження: масивна травма, досвід, практика, орієнтири, підготовка, наявні ресурси."},{"m":"08","d":1,"q":"Що таке гіпотермія?","c":"Зниження внутрішньої температури тіла","w":["Підвищення температури тіла","Зневоднення","Опік шкіри"],"e":"Гіпотермія — зниження внутрішньої (core) температури тіла."},{"m":"08","d":1,"q":"Чи може гіпотермія виникати в спекотних умовах у пораненого?","c":"Так, через крововтрату та шок","w":["Ні, гіпотермія можлива лише при морозі та перебуванні у воді","Лише при опіках, у решті випадків спека захищає від охолодження","Лише ввечері"],"e":"Втрата крові й шок порушують терморегуляцію, тому гіпотермія можлива навіть у теплому середовищі."},{"m":"08","d":2,"q":"Яка температура тіла вже збільшує смертність у травмованих?","c":"Нижче 36 °C","w":["Нижче 30 °C","Нижче 20 °C","Вище 38 °C"],"e":"Навіть невелике зниження (нижче 36 °C) підвищує смертність у травмованих і опечених."},{"m":"08","d":2,"q":"Чому гіпотермія погіршує кровотечу?","c":"Холод уповільнює ферменти згортання й знижує склеювання тромбоцитів","w":["Холод розріджує кров і розширює рану, тому вона довше кровоточить","Холод підвищує тиск і розриває згустки, що вже утворилися","Вона розширює рану"],"e":"Холод сповільнює ферментативні реакції зсідання крові та зменшує склеювання тромбоцитів, тому згустки утворюються гірше."},{"m":"08","d":2,"q":"Що входить до «летальної тріади» травми?","c":"Гіпотермія, ацидоз, коагулопатія","w":["Біль, страх, спрага","Головний біль, нудота, пітливість","Гіпертермія, алкалоз, гіпоксія"],"e":"Летальна тріада: гіпотермія, ацидоз та порушення згортання (коагулопатія) — вони підсилюють одне одного."},{"m":"08","d":2,"q":"У кого гіпотермія розвивається швидше?","c":"У постраждалих з опіками","w":["У спортсменів","У людей, що п'ють воду","У тих, хто у броні"],"e":"При опіках шкіра, яка утримує тепло, втрачена, тому тіло втрачає тепло швидше."},{"m":"08","d":2,"q":"Що з переліченого належить до ризиків гіпотермії?","c":"Середня й тяжка травма, ЧМТ, опіки, порушена свідомість, нездатність тремтіти","w":["Відпочинок, нормальна температура середовища й сухий теплий одяг","Легке поранення кисті без крововтрати й збережена свідомість","Відпочинок"],"e":"Високий ризик: травма середнього/тяжкого ступеня, ураження ЦНС, опіки, порушена свідомість, відсутність тремтіння."},{"m":"08","d":2,"q":"Що сказано про профілактику гіпотермії?","c":"Її набагато легше запобігти, ніж лікувати","w":["Лікувати легше, ніж запобігти","Потрібна лише у холод","Потрібна лише при ЧМТ"],"e":"Гіпотермії набагато легше запобігти, тому заходи розпочинають рано й рішуче."},{"m":"08","d":2,"q":"Що слід зробити з мокрим одягом пораненого?","c":"Замінити на сухий, якщо можливо","w":["Залишити","Додатково змочити","Зняти й залишити оголеним"],"e":"Мокрий одяг сприяє втраті тепла, його замінюють на сухий, якщо це можливо."},{"m":"08","d":2,"q":"Як слід використовувати гідроізоляційну оболонку при пасивному зігріванні?","c":"Обернути навколо пораненого повністю, включно з головою, не закриваючи обличчя","w":["Лише накрити ноги, а голову й тулуб залишити відкритими","Закрити також обличчя, щоб утримати максимум тепла","Закрити обличчя"],"e":"Загортають повністю, включно з головою, але обличчя не закривають, і не кладуть пораненого на холодну землю без ізоляції."},{"m":"08","d":2,"q":"Що слід пам'ятати про самонагрівну ковдру?","c":"Не класти безпосередньо на шкіру — ризик опіків","w":["Класти лише на голу шкіру для найкращого прогріву","Використовувати її лише влітку й тільки на ноги","Вона не нагрівається"],"e":"Самонагрівну ковдру не кладуть на шкіру — можливі опіки. Її розміщують поверх пасивної ізоляції."},{"m":"08","d":3,"q":"Чому пасивні методи можуть бути недостатніми?","c":"Вони не дають зворотного підвищення температури при значній крововтраті","w":["Вони завжди повністю замінюють активне зігрівання при кровотечі","Вони шкідливі й збільшують втрату тепла","Вони шкідливі"],"e":"Пасивні методи лише зменшують втрату тепла; при значній крововтраті власного тепла замало, тому потрібні активні методи."},{"m":"08","d":2,"q":"Що таке активні методи лікування гіпотермії?","c":"Використання зовнішніх пристроїв для зігрівання пораненого","w":["Лише теплий одяг і гаряче пиття для пораненого","Перебування біля вогню без жодного захисту й ізоляції","Лише теплий одяг"],"e":"Активне зігрівання — зовнішні пристрої (нагрівальні ковдри, підігрів інфузій). Пасивне — збереження власного тепла ізоляцією."},{"m":"08","d":2,"q":"Яке обмеження можуть мати активні пристрої для зігрівання?","c":"Холодна погода, висота, розряджені батареї, специфіка операції","w":["Вони завжди працюють у будь-яких умовах, без обмежень","Їм не потрібне живлення, тому вони не залежать від батарей і холоду","Немає обмежень"],"e":"Обмеження: особливості місій, холод, висота (для кисневих/хімічних), розряджені батареї підігрівачів рідин."},{"m":"08","d":2,"q":"Яку температуру має мати кров при переливанні за методикою TFC?","c":"38 °C","w":["10 °C","20 °C","50 °C"],"e":"Кров підігрівають до 38 °C, щоб не охолоджувати пораненого."},{"m":"08","d":2,"q":"Коли застосовують обережне поводження з пораненим?","c":"Після вибуху, падіння чи травми високої енергії через ризик перелому таза чи хребта","w":["Лише після опіку та при гіпотермії, в решті випадків не потрібно","Ніколи, бо обережне поводження уповільнює евакуацію","Ніколи"],"e":"Обережне поводження показане при вибуху, падінні, кінетичній травмі — є ризик перелому таза чи ушкодження хребта; пріоритет M та A."},{"m":"08","d":3,"q":"Де розташовують пристрій для компресії таза (ПКТ)?","c":"На рівні великих вертлюгів, а не клубових гребенів","w":["На рівні гребенів клубових кісток, де таз найширший","На рівні колін, щоб не заважати кровообігу в тулубі","На рівні колін"],"e":"ПКТ ставлять на рівні великих вертлюгів, а не гребенів, і зв'язують коліна/стопи, щоб запобігти зовнішній ротації ніг."},{"m":"08","d":2,"q":"Для чого фіксують коліна й стопи разом при накладанні ПКТ?","c":"Щоб запобігти зовнішній ротації ніг","w":["Щоб полегшити дихання","Щоб зупинити кровотечу з кінцівок","Щоб зігріти ноги"],"e":"Зв'язування колін/стоп запобігає зовнішній ротації ніг і допомагає стабілізувати таз."},{"m":"08","d":2,"q":"У яких випадках ПКТ НЕ слід накладати?","c":"Відкритий перелом таза, рвані рани промежини, опіки, важкі супутні ушкодження м'яких тканин таза","w":["Біль у ділянці таза та вибухова травма","Нестабільність таза й ознаки шоку після тупої травми","Вибухова травма"],"e":"Протипоказання до ПКТ: відкритий перелом таза, рвані рани промежини, опіки, важкі супутні ушкодження м'яких тканин (також операційні травми живота)."},{"m":"08","d":2,"q":"Коли слід накласти ПКТ?","c":"Тяжка тупа чи вибухова травма, біль у тазі, ампутація ноги, нестабільність таза, непритомність або шок","w":["Подряпина на нозі та поверхневе садно","Лише біль у шиї й головний біль без травми таза","Біль у шиї"],"e":"Покази: механізм (тупа/вибухова), біль у тазі, повна/часткова ампутація, ознаки перелому таза, непритомність чи шок."},{"m":"08","d":1,"q":"Яка буква в MARCH стосується профілактики гіпотермії?","c":"H","w":["M","A","R"],"e":"H (Head/Hypothermia) — ЧМТ та профілактика гіпотермії."},{"m":"08","d":3,"q":"Чому ЧМТ підвищує ризик гіпотермії?","c":"Центр терморегуляції розташований у гіпоталамусі","w":["Центр терморегуляції розташований у мозочку, який ушкоджується першим","Через алергію на ліки, що використовують при ЧМТ","Через алергію"],"e":"Терморегуляція контролюється гіпоталамусом, ушкодження ЦНС порушує її."},{"m":"08","d":3,"q":"Поранений втратив багато крові, у спеку лежить на землі. Що вирішальне для профілактики гіпотермії?","c":"Ізолювати від землі, загорнути в гідроізоляцію включно з головою","w":["Нічого не робити, бо в спеку гіпотермія неможлива","Дати холодної води й залишити лежати на землі","Дати холодної води"],"e":"Втрата крові викликає гіпотермію навіть у спеку; землю ізолюють, пораненого оберігають від втрати тепла."},{"m":"08","d":2,"q":"Яке з наведених є механізмом втрати тепла?","c":"Випаровування","w":["Утворення піту без втрати","Розширення зіниць","Біль"],"e":"До механізмів належать кондукція, конвекція, радіація, випаровування та дихання."},{"m":"10","d":1,"q":"Що означає літера R в алгоритмі MARCH?","c":"Respiration — дихання","w":["Resuscitation — реанімація","Radio — зв'язок","Rescue — порятунок"],"e":"R — Respiration: оцінка та допомога при порушеннях дихання й травмі грудної клітки."},{"m":"10","d":1,"q":"Що таке вентиляція?","c":"Фізичний процес руху повітря всередину легень і назовні","w":["Лише процес надходження повітря в легені без видиху","Транспорт крові від серця до тканин","Лише видих"],"e":"Вентиляція — механічний рух повітря в легені та з них (вдих і видих)."},{"m":"10","d":1,"q":"Що відбувається під час вдиху (інспірації)?","c":"Повітря надходить у легені, доставляючи кисень до тканин легень","w":["Вивільняється CO2, а кисень надходить лише при видиху","Серце зупиняється, а кров рухається назад до легень","Кров тече назад"],"e":"Інспірація — вдих: надходження повітря і кисню; видих (експірація) — вивільнення CO2."},{"m":"10","d":1,"q":"Яка ознака дихальної недостатності?","c":"Задишка, тахіпное, ціаноз губ","w":["Спокійне дихання","Нормальний колір шкіри","Повільний пульс при сні"],"e":"До ознак належать задишка, тахіпное, ціаноз, розширення крил носа, втягування міжребер'їв, положення триноги, сплутаність/збудження."},{"m":"10","d":2,"q":"Що таке положення «триноги»?","c":"Постраждалий сидить або стоїть, нахилившись уперед і спираючись руками на коліна","w":["Постраждалий лежить на спині, закинувши голову назад","Лежить на боці, підтягнувши коліна до грудей","Стоїть рівно"],"e":"Положення триноги — ознака дихальної недостатності: поранений сидить з нахилом уперед, руки на колінах."},{"m":"10","d":2,"q":"Що означає втягування (ретракції) при диханні?","c":"Втягування шкіри в ділянці яремної ямки чи міжребер'їв при вдиху","w":["Розширення крил носа під час кожного видиху","Посиніння губ і навколо рота при тривалій затримці дихання","Кашель"],"e":"Ретракції — втягнення шкіри над ключицями/між ребрами при вдиху, ознака посиленої роботи дихання."},{"m":"10","d":2,"q":"Від якого показника пульсоксиметра можна запідозрити дихальну недостатність?","c":"Нижче 90 %","w":["Нижче 98 %","Нижче 100 %","Вище 95 %"],"e":"SpO2 <90 % може вказувати на дихальну недостатність у пораненого."},{"m":"10","d":2,"q":"Чому оцінка гіпоксемії в TFC складна?","c":"Огляд неточний через тактичне середовище, погане освітлення маскує ознаки","w":["Бо в польових умовах легені не потребують кисню","Бо пульсоксиметри завжди помиляються на половину показника","Бо немає легень"],"e":"У TFC огляд ускладнений обстановкою й освітленням, тому пульсоксиметрія допомагає, але потребує інтерпретації."},{"m":"10","d":2,"q":"Що таке проникаюче поранення грудної клітки?","c":"Вогнепальне або уламкове поранення грудної клітки","w":["Забій грудної клітки без порушення цілісності шкіри","Опік грудей і больовий синдром без рани","Опік грудей"],"e":"Проникаюче — через грудну стінку (куля, осколок). Тупа травма — удар, вибух, ДТП без порушення цілісності."},{"m":"10","d":2,"q":"Які прояви тупої травми грудної клітки?","c":"Деформації, синці, набряки, крепітація, будь-яка деформація грудної клітки","w":["Лише кашель, гарячка та озноб без видимих ушкоджень","Лише рани з кровотечею та сторонні тіла в плевральній порожнині","Лише кашель"],"e":"Тупа травма: деформації, синці, набряки, забої, крепітація (потріскування) при пальпації або на слух."},{"m":"10","d":2,"q":"Що слід робити, виявивши проникаюче поранення грудної клітки?","c":"Закрити рану рукою в рукавичці, потім накласти оклюзійну наліпку","w":["Залити рану водою та глибоко затампонувати марлею","Накласти турнікет і залишити рану відкритою","Нічого не робити"],"e":"Спершу закрийте рану рукою в рукавичці, потім накладіть оклюзійну наліпку, бажано з клапаном."},{"m":"10","d":2,"q":"Як шукати інші поранення грудної клітки?","c":"Розкрити, оглянути й пропальпувати, включно зі спиною й пахвами","w":["Лише подивитися спереду, спина не потрібна","Лише прослухати серце без огляду та пальпації","Нічого шукати"],"e":"Огляд та пальпація передньої, задньої поверхні й пахв; на кожну відкриту рану — наліпка з клапаном."},{"m":"10","d":2,"q":"Що таке відкритий пневмоторакс?","c":"Повітря потрапляє в грудну порожнину через рану, а не через дихальні шляхи, легеня не розправляється","w":["Накопичення крові між легенями та грудною стінкою","Перелом ребер із парадоксальним рухом сегмента грудної стінки","Перелом ребер"],"e":"При відкритому пневмотораксі на вдиху повітря входить через рану; легеня не розправляється. Рана 2-2,5 см вже може викликати його."},{"m":"10","d":2,"q":"Які ознаки рани грудної клітки, що всмоктує повітря?","c":"Звук всмоктування чи шипіння на вдиху, піна/бульбашки навколо рани, дихальна недостатність, кров'янисте мокротиння","w":["Рана без звуку, без піни й без утруднення дихання","Біль у плечі та нудота без ознак дихальної недостатності","Нудота"],"e":"Типові ознаки: шипіння/свист при вдиху, піна, дихальна недостатність, кровохаркання."},{"m":"10","d":2,"q":"Яку наліпку слід застосувати першою при відкритій рані грудної клітки?","c":"Оклюзійну наліпку з клапаном","w":["Оклюзійну наліпку без клапана як основну","Тиснучу пов'язку з тугим бинтом","Турнікет"],"e":"Рекомендовано негайно торакальну оклюзійну наліпку з клапаном; якщо її немає — без клапана."},{"m":"10","d":2,"q":"Що робить клапан торакальної наліпки?","c":"Випускає повітря при видиху, не пускає його при вдиху","w":["Пускає повітря всередину при видиху, не пускає назовні","Нічого не робить, лише закриває рану для краси","Зупиняє кров"],"e":"На видиху повітря виходить через клапан, на вдиху наліпка присмоктується до рани й блокує надходження повітря."},{"m":"10","d":3,"q":"Коли слід прикладати оклюзійну наліпку?","c":"Під час видиху пораненого","w":["Під час вдиху","Коли він затримує вдих після вдиху","Тільки коли непритомний"],"e":"Наліпку прикладають на видиху, щоб не затримати повітря у грудній порожнині."},{"m":"10","d":2,"q":"На яку відстань край наліпки має виходити за край рани?","c":"5 см","w":["1 мм","10 см","Не має значення"],"e":"Край наліпки має виходити приблизно на 5 см за межі рани для надійної герметизації."},{"m":"10","d":3,"q":"Стан пораненого після накладання оклюзійної наліпки погіршується. Що це може бути й що робити?","c":"Напружений пневмоторакс; випустити повітря з-під наліпки (провітрювання) або зняти її на кілька секунд","w":["Алергія на матеріал наліпки; потрібно ввести антибіотик і залишити як є","Гіпотермія; зігріти пораненого й нічого не змінювати","Алергія; дати ліки"],"e":"Погіршення після наліпки — підозра на напружений пневмоторакс. Спершу випускають повітря з-під наліпки, а за потреби виконують голкову декомпресію."},{"m":"10","d":2,"q":"Яке положення надають притомному пораненому після наліпки з клапаном?","c":"Сидяче або зручне, що полегшує дихання","w":["Лежачи на спині рівно з піднятими ногами","Головою вниз із ногами догори","На спині рівно"],"e":"Притомний — сидячи/у зручному положенні. Непритомний — стабільне бокове пораненою стороною донизу."},{"m":"10","d":2,"q":"Яке положення при непритомності після оклюзійної наліпки?","c":"Стабільне бокове пораненою стороною донизу","w":["На спині здоровою стороною донизу","Сидячи","На животі"],"e":"Непритомного кладуть у стабільне бокове положення пораненою стороною вниз."},{"m":"10","d":2,"q":"Що таке напружений пневмоторакс?","c":"Повітря накопичується в плевральній порожнині через односторонній клапан, тиск зростає й стискає легені та серце","w":["Закриття рани на грудях і припинення кровотечі","Накопичення крові в плеврі без ознак порушення дихання","Набряк горла"],"e":"Ушкоджена тканина діє як односторонній клапан: тиск росте, стискає обидві легені й серце."},{"m":"10","d":2,"q":"Яка ознака напруженого пневмотораксу є раннєю?","c":"Важка або прогресуюча дихальна недостатність, тахіпное, відсутні чи знижені дихальні шуми на одному боці, SpO2 <90 %","w":["Відхилення трахеї, шок і травматична зупинка серця","Підшкірна емфізема й зміщення середостіння","Шок"],"e":"Ранні ознаки: важка дихальна недостатність, тахіпное, послаблені дихальні шуми, SpO2 <90 %. Відхилення трахеї — пізня ознака."},{"m":"10","d":2,"q":"Що належить до пізніх ознак напруженого пневмотораксу?","c":"Шок, травматична зупинка серця без смертельних ран, зміщення середостіння, підшкірна емфізема, відхилення трахеї","w":["Прогресуюча дихальна недостатність і тахіпное","Послаблені дихальні шуми на одному боці та SpO2 <90 %","Лише біль"],"e":"Пізні ознаки: шок, травматична зупинка серця, зміщення середостіння, підшкірна емфізема, відхилення трахеї."},{"m":"10","d":1,"q":"Яке рекомендоване втручання при підозрі на напружений пневмоторакс?","c":"Голкова декомпресія грудної клітки","w":["Гіпервентиляція мішком Амбу для розправлення легені","Накладання турнікета на грудну клітку","Давання води"],"e":"Рекомендоване втручання — голкова декомпресія (NDC)."},{"m":"10","d":2,"q":"Які два місця прийнятні для голкової декомпресії?","c":"П'яте міжребер'я по передній пахвовій лінії або друге міжребер'я по середньоключичній лінії","w":["Третє міжребер'я по середній лінії груднини або 7-ме по лопатковій лінії","Четверте міжребер'я по задній пахвовій лінії або під ключицею медіально","Шосте міжребер'я по задній лінії"],"e":"Є два рівноцінні місця: 5-те міжребер'я по передній пахвовій лінії та 2-ге міжребер'я по середньоключичній лінії; жодне не краще за інше."},{"m":"10","d":3,"q":"Куди ніколи не слід вводити голку при декомпресії?","c":"Медіальніше від середньоключичної (соскової) лінії","w":["Латеральніше від соскової лінії в 5-му міжребер'ї","У п'яте міжребер'я по передній пахвовій лінії","У пахвову лінію"],"e":"Медіальніше середньоключичної лінії небезпечно — ризик ураження серця та великих судин."},{"m":"10","d":2,"q":"Яке положення надають притомному після голкової декомпресії?","c":"Сидяче","w":["Лежачи на спині ногами догори","Головою вниз","Лише на животі"],"e":"Притомному дозволяють сидіти; непритомного — на спині або у стабільне бокове пораненою стороною вниз."},{"m":"10","d":3,"q":"Що робити, якщо після першої голкової декомпресії стан покращився, але симптоми повернулися?","c":"Другу декомпресію на тому самому місці латеральніше від початкової","w":["Не робити нічого й тільки подавати кисень без повторної процедури","Зняти голку й закрити місце пластирем, чекати 15 хвилин","Нічого"],"e":"Повторний напружений пневмоторакс: друга NDC на тому самому місці, але латеральніше від початкової."},{"m":"10","d":2,"q":"Що робити, якщо перша голкова декомпресія не покращила стан?","c":"Друга декомпресія в альтернативному місці, далі оцінка C за MARCH","w":["Повторити те саме місце тією ж голкою без змін","Припинити допомогу й евакуювати без подальшої оцінки кровообігу","Зняти голку"],"e":"При відсутності покращення — друга NDC в альтернативному місці; якщо покращення немає — переходьте до C."},{"m":"10","d":3,"q":"Чому під час переміщення пораненого після NDC треба бути уважним?","c":"Зайві рухи можуть зсунути або перекрити просвіт голки","w":["Голка може розчинитися, якщо її торкатися руками","Рухи пораненого стимулюють кровотечу з місця введення голки","Бо він може закричати"],"e":"Рухи можуть змістити чи закупорити голку, тому переміщуйте обережно."},{"m":"10","d":2,"q":"Що таке гемоторакс?","c":"Накопичення крові в плевральній порожнині","w":["Накопичення повітря в плевральній порожнині під тиском","Запалення плеври без накопичення рідини чи крові","Перелом ребер"],"e":"Гемоторакс — кров між легенями та грудною стінкою; ознаки: біль, дихальна недостатність, гіпотензія, шок."},{"m":"10","d":2,"q":"Що таке флотуюча грудна клітка?","c":"3 і більше ребра зламані у 2 і більше місцях з парадоксальним рухом сегмента","w":["Один перелом ребра без порушення рухів грудної стінки","Вивих ключиці та перелом груднини з деформацією шиї","Вивих ключиці"],"e":"Флотуюча грудна клітка — вільно рухомий сегмент через множинні переломи; потрібні знеболення та спостереження за пневмотораксом."},{"m":"10","d":2,"q":"Які особливості вентиляції при вибуховій легені?","c":"Низький тиск, уникати агресивної вентиляції","w":["Максимальний тиск і висока частота дихання для розправлення легень","Не вентилювати, чекати самостійного дихання","Не вентилювати"],"e":"При вибуховій легені агресивна вентиляція збільшує ушкодження, тому використовують низький тиск."},{"m":"10","d":3,"q":"Коли може погіршитися стан при вибуховій легені?","c":"Протягом перших 24 годин, інколи через кілька годин після вибуху","w":["Лише одразу після вибуху, пізніше стан завжди стабільний","Лише через місяць після вибуху","Ніколи"],"e":"Симптоми вибухової легені можуть з'явитися відразу або через години; потрібен постійний нагляд, особливо перші 24 год."},{"m":"10","d":2,"q":"Коли за TCCC рекомендується кисень у польових умовах?","c":"При рефрактерному шоці та ЧМТ","w":["Усім пораненим без винятку й завжди, незалежно від стану","Лише при опіках, у решті випадків кисень не рекомендується","Ніколи"],"e":"Поточні настанови рекомендують кисень лише при рефрактерному шоці та ЧМТ; доступність кисню в польових умовах обмежена."},{"m":"10","d":2,"q":"Яку сатурацію прагнуть підтримувати при подачі кисню в TFC?","c":"Понад 90 %","w":["Понад 50 %","Рівно 100 %","Менше 80 %"],"e":"Підтримують SpO2 >90 %, швидкість потоку часто 3 л/хв."},{"m":"10","d":2,"q":"Як працює пульсоксиметр?","c":"Використовує інфрачервоне світло, що проходить через судини","w":["Вимірює артеріальний тиск за допомогою манжети","Вимірює температуру тіла за ультрафіолетовим випромінюванням","Рахує ребра"],"e":"Пульсоксиметр оцінює насичення гемоглобіну киснем за допомогою інфрачервоного світла."},{"m":"10","d":2,"q":"Яка найпоширеніша причина смерті на полі бою, якій можна запобігти, з-поміж ускладнень травми грудної клітки?","c":"Напружений пневмоторакс","w":["Закритий перелом ребра","Крововилив у ліктьовий суглоб","Вивих плеча"],"e":"Напружений пневмоторакс залишається основною причиною смерті, якій можна запобігти, навіть при сучасних бронежилетах."},{"m":"10","d":3,"q":"Поранений дихає важко, SpO2 86 %, зліва дихальні шуми відсутні, є рана на грудях із наліпкою. Що наступне?","c":"Випустити повітря з-під наліпки й виконати голкову декомпресію","w":["Дати знеболювальне й чекати, не торкаючись наліпки","Накласти ще одну наліпку й ввести антибіотик одразу","Ввести антибіотик"],"e":"Ознаки напруженого пневмотораксу: ранній прояв — SpO2 <90 %, відсутні шуми. Лікування: провітрювання наліпки і голкова декомпресія."},{"m":"11","d":1,"q":"Який показник часу капілярного наповнення вважається нормою?","c":"Менше 3 секунд","w":["Більше 10 секунд","Рівно 20 секунд","Не вимірюється"],"e":"ЧКН <3 с — норма. Довший час може вказувати на порушення периферичної перфузії."},{"m":"11","d":1,"q":"На якій артерії перевіряють пульс при оцінці кровообігу?","c":"На променевій","w":["На підколінній","На скроневій лише","На яремній вені"],"e":"Стандартна перевірка — пульс на променевій артерії, а також колір шкіри та ЧКН."},{"m":"11","d":2,"q":"Що оцінюють на етапі C в алгоритмі MARCH?","c":"Огляд на невиявлені кровотечі та переломи, колір шкіри, ЧКН, пульс на променевій артерії","w":["Лише температуру тіла й вологість шкіри","Лише частоту дихання без огляду на кровотечі","Лише дихання"],"e":"На C: пошук прихованих кровотеч і переломів, колір шкіри, ЧКН, пульс на променевій артерії."},{"m":"11","d":2,"q":"Що означає систолічний тиск?","c":"Тиск, коли серце скорочується (вищий показник)","w":["Тиск, коли серце розслабляється (нижній показник)","Середній тиск у венозній системі між скороченнями","Тиск у венах"],"e":"Систолічний — коли серце працює (верхнє число); діастолічний — коли відпочиває (нижнє)."},{"m":"11","d":2,"q":"Коли при вимірюванні тиску аускультативним методом чути перший тон?","c":"Це систолічний тиск","w":["Це діастолічний тиск","Це пульс","Це середній тиск"],"e":"Поява першого тону — систолічний (вищий) показник, зникнення тонів — діастолічний."},{"m":"11","d":2,"q":"Чим слід розрізати одяг, щоб оглянути рани?","c":"Атравматичними ножицями","w":["Незахищеним лезом","Розривати руками","Не розрізати одяг"],"e":"Використовують атравматичні ножиці, щоб не завдати нових травм."},{"m":"11","d":2,"q":"Які показання до переміщення турнікета?","c":"Накладений поверх уніформи, занадто проксимально (вище 8 см від рани), понад 2 години до хірургічної допомоги","w":["Турнікет ефективний і накладений нижче рани на 15 см","Шок, ампутація чи неможливість наглядати за раною","Шок"],"e":"Переміщення (прицільна заміна): турнікет поверх одягу, надто високо або >2 год до хірургічної допомоги."},{"m":"11","d":3,"q":"Яка послідовність переміщення турнікета?","c":"Накласти прицільний турнікет на 5-8 см вище рани на шкіру, повільно послабити початковий, посунути вниз, записати час","w":["Просто зняти початковий турнікет і накласти новий без контролю кровотечі","Лише послабити початковий і залишити його без нового","Вимкнути"],"e":"Спочатку новий (прицільний) турнікет, потім повільно послаблюють початковий, пересувають вниз, записують час. Якщо кровотеча не зупинилась, повертають початковий."},{"m":"11","d":2,"q":"У яких ситуаціях переміщення/конверсія малоймовірна?","c":"Ампутації, розірвані артерії, глибокі рани з пошкодженням артерій, які важко тампонувати","w":["Поверхневі подряпини та садна, які легко тампонувати","Рани нижче ліктя, де кровотеча завжди зупиняється сама","Будь-які рани"],"e":"Малоймовірна заміна при ампутаціях, розірваних артеріях та глибоких ранах із ушкодженням артерій, де важко тампонувати чи тиснути."},{"m":"11","d":3,"q":"Які існують протипоказання до конверсії турнікета?","c":"Шок, неможливість спостерігати за раною, ампутація, понад 6 год, тактична недоцільність","w":["Лише біль і гарячка в пораненого без інших ознак","Лише головний біль і нудота в пораненого","Лише біль"],"e":"Протипоказання: шок, немає змоги уважно стежити, ампутація, турнікет >6 год, тактична/медична недоцільність."},{"m":"11","d":2,"q":"Як послаблюють турнікет при конверсії?","c":"Повільно, не менше 1 хвилини, не допускаючи повторної кровотечі","w":["Різко, за 1 секунду, щоб перевірити, чи кровотеча зупинилась","Повільно за 30 хвилин із контролем температури","За 30 хвилин"],"e":"Після тампонування й тиску 3 хв накладають тиснучу пов'язку і повільно послаблюють турнікет щонайменше 1 хв."},{"m":"11","d":2,"q":"Що робити, якщо після конверсії турнікета кровотеча не контролюється?","c":"Накласти турнікет назад","w":["Покласти холод","Дати ліки","Лише додатково перев'язати"],"e":"Якщо конверсія не вдається — турнікет затягують знову."},{"m":"11","d":2,"q":"У якій формі документують втручання?","c":"DD 1380 TCCC","w":["Лише в зошиті","Усно","Не документують"],"e":"Усі результати огляду та лікування записують у Картку пораненого DD 1380 і прикріплюють до нього."},{"m":"11","d":3,"q":"Що робити при рані кінцівки зі сторонім предметом, якщо проводиться конверсія?","c":"Турнікет високо й туго, заміна турнікета, повторно затягнути, потім видалити/тампонувати за алгоритмом","w":["Одразу видалити предмет, а потім зняти турнікет без тампонування","Накласти тугу пов'язку на предмет і залишити турнікет н
