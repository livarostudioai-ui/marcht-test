іщення тазових бандажів?","c":"40 % бандажів були розміщені занадто високо","w":["Усі були ідеальні","80 % розмістили занадто низько","Бандажі непотрібні"],"e":"У дослідженні 40 % бандажів розташували занадто високо, тому важливо накладати на рівні великих вертлюгів."},{"m":"11","d":3,"q":"Який імпровізований спосіб компресії таза допускається?","c":"Штани пораненого: розрізати штанини, розправити й затягнути поперек тазу, або простирадло чи ковдра на рівні вертлюгів","w":["Туго стягнути живіт мотузкою на рівні пупка","Накласти турнікет на талію й залишити ноги вільними","Нічого не робити"],"e":"Імпровізований ПКТ: розрізати штанини, розправити, затягнути поперек тазу, або обв'язати таз простирадлами/ковдрами на рівні вертлюгів, а коліна/стопи зв'язати."},{"m":"11","d":2,"q":"Які ПКТ згадуються як рекомендовані?","c":"PelvicBinder, SAM Pelvic Sling II, T-POD","w":["Лише Blizzard, SAM Splint і CAT-турнікет","Лише імпровізовані засоби, бо стандартних ПКТ не існує","SAM Splint"],"e":"Приклади ПКТ: PelvicBinder, SAM Pelvic Sling II, T-POD."},{"m":"11","d":2,"q":"З чого починають прогресивні стратегії зупинки зовнішньої кровотечі?","c":"Звільнити рани від одягу й оцінити, чи турнікет ще показаний","w":["З тампонування без огляду та оцінки одягу","З антибіотиків і знеболення до зупинки кровотечі","З переливання"],"e":"Прогресивна стратегія: розкрити рани, оцінити показання, виконати переміщення/конверсію, оцінити таз та шок."},{"m":"11","d":3,"q":"Як діяти, якщо турнікет накладено правильно, але рана піддається тампонуванню?","c":"Провести конверсію турнікета на тампонування й тиснучу пов'язку, якщо немає протипоказань","w":["Залишити турнікет на 6 годин без перевірки та оцінки","Зняти турнікет без контролю та накласти на нього тиснучу пов'язку","Збільшити тиск"],"e":"Якщо рана піддається тампонуванню й тиску, а протипоказань немає, проводять конверсію."},{"m":"11","d":2,"q":"Що відбувається при тупій травмі живота з видимими екхімозами навколо пупка?","c":"Може бути внутрішня кровотеча, лікують як геморагічний шок","w":["Це косметична проблема, лікування не потрібне","Це алергічна реакція, що потребує антигістамінних","Це опік"],"e":"Екхімози (симптом Каллена) разом з болем та ригідністю вказують на внутрішню кровотечу; тактика — як при геморагічному шоці."},{"m":"12","d":1,"q":"Що таке шок за матеріалами курсу?","c":"Зменшення кисню в тілі, що веде до анаеробного метаболізму, ацидозу й загибелі клітин","w":["Підвищення температури тіла внаслідок інфекції та запалення","Біль у серці через обструкцію коронарних судин","Лише біль"],"e":"Шок: клітини не отримують кисню, переходять на анаеробний обмін (молочна кислота), гинуть, відмирають органи."},{"m":"12","d":1,"q":"Яка найпоширеніша причина шоку на полі бою?","c":"Геморагічний шок (крововтрата)","w":["Анафілактичний шок після укусу комахи","Септичний шок через бактеріальну інфекцію рани","Септичний"],"e":"На полі бою найчастіше трапляється геморагічний шок."},{"m":"12","d":2,"q":"Які ознаки геморагічного шоку?","c":"Слабкий або відсутній пульс на променевій артерії, змінена свідомість, тахікардія, тахіпное, холодна липка шкіра","w":["Гарячі суха шкіра, повільний пульс і підвищений тиск","Рум'янець, надмірне потовиділення й міцний пульс на променевій","Рум'янець"],"e":"Типово: слабкий/відсутній пульс на радіальній артерії, зміна свідомості, тахікардія, тахіпное, холодна липка шкіра."},{"m":"12","d":2,"q":"Які найнадійніші показники шоку в польових умовах?","c":"Рівень свідомості та пульс на променевій артерії","w":["Колір очей, температура повітря та кількість поранених","Лише частота серцевих скорочень без оцінки свідомості","Лише ЧСС"],"e":"Свідомість і радіальний пульс — найнадійніші в польових умовах індикатори геморагічного шоку."},{"m":"12","d":3,"q":"Скільки крові втрачено, якщо з'являються змінений психічний стан, слабкий радіальний пульс >100 і тахіпное?","c":"Близько 1500 мл","w":["500 мл","1000 мл","2500 мл"],"e":"1500 мл: змінений психічний стан, слабкий пульс >100, тахіпное; потрібне швидке втручання. 2000 мл — сплутаність, ЧСС >120, ЧД >35; 2500 мл — непритомність."},{"m":"12","d":2,"q":"Що характерно для втрати 2500 мл крові?","c":"Відсутність свідомості, відсутній пульс на променевій чи сонній артерії, ЧСС >140, ЧД >35, летально без негайного втручання","w":["Нормальний пульс, ясна свідомість і ЧД 16 за хвилину","Легка тахікардія та відсутність негативних ефектів","Нормальний пульс"],"e":"2500 мл — тяжка стадія: непритомність, відсутній пульс, ЧСС >140, ЧД >35."},{"m":"12","d":3,"q":"Який об'єм крововтрати зазвичай не дає негативних ефектів?","c":"500 мл","w":["1500 мл","2000 мл","2500 мл"],"e":"500 мл — можлива легка тахікардія; зазвичай негативних наслідків немає. 1000 мл — пульс >100, мала ймовірність наслідків при зупинці кровотечі."},{"m":"12","d":2,"q":"Які заходи при геморагічному шоці?","c":"2 г TXA, препарати крові, профілактика гіпотермії, постійна переоцінка","w":["Лише вода й кисень без зупинки кровотечі та зігрівання","Лише знеболення й антибіотик без втручань з кровообігу","Лише вода"],"e":"Лікування: TXA 2 г ВВ/ВК, компоненти крові, профілактика гіпотермії, переоцінка, запобігання рефрактерному шоку."},{"m":"12","d":2,"q":"Коли показаний ВВ доступ?","c":"Шок, значний ризик шоку, неможливість ковтати ліки, необхідність ВВ препаратів","w":["Усім пораненим без винятку для підготовки до погіршення","Лише при подряпинах та головному болю без шоку","Лише при подряпинах"],"e":"Не кожному потрібен ВВ доступ: лише при шоку, високому ризику, неможливості ковтати чи потребі ВВ препаратів."},{"m":"12","d":2,"q":"Який катетер підходить для введення рідини та крові?","c":"18G","w":["27G","25G","30G"],"e":"Катетери 18G підходять для рідини/крові. Під час введення фіксують трубки, щоб не змістити катетер."},{"m":"12","d":2,"q":"Яке протипоказання до ВВ доступу?","c":"Травма (пошкодження чи розрив судин) проксимальніше місця введення","w":["Алергія на кисень та підвищений артеріальний тиск","Біль у руці з протилежного боку й легкий ціаноз","Високий тиск"],"e":"ВВ доступ не ставлять, якщо судини проксимальніше місця введення пошкоджені — рідина витікатиме."},{"m":"12","d":2,"q":"Коли показаний ВК доступ?","c":"Дві невдалі спроби ВВ або ВВ складний чи неможливий","w":["Завжди першим, ще до оцінки периферичного доступу","При подряпинах і лише у дітей до 10 років","Лише у дітей"],"e":"ВК показаний після двох невдалих спроб периферичного доступу або коли ВВ складно/неможливо отримати."},{"m":"12","d":3,"q":"Яке протипоказання до ВК у системі FAST1?","c":"Постраждалі дрібної статури або менше 50 кг","w":["Вага понад 100 кг і високий зріст","Наявність броні та тактичних окулярів у пораненого","Високий зріст"],"e":"Для FAST1 протипоказання — малий зріст/статура чи вага <50 кг; також переломи, інфекції чи травми в місці доступу."},{"m":"12","d":2,"q":"Яка швидкість потоку EZ-IO в плечову кістку?","c":"105 мл/хв","w":["80 мл/хв","16,6 мл/хв","5 мл/хв"],"e":"EZ-IO humerus — 105 мл/хв, FAST1 грудина — 80 мл/хв, EZ-IO tibia — 16,6 мл/хв."},{"m":"12","d":3,"q":"Яка з ВК-ділянок має найменшу швидкість потоку?","c":"Великогомілкова кістка (EZ-IO tibia)","w":["Плечова кістка (EZ-IO humerus), 105 мл/хв","Груднина (FAST1), 80 мл/хв","Усі однакові"],"e":"Tibia — 16,6 мл/хв, значно повільніше, ніж humerus (105) чи sternum (80)."},{"m":"12","d":2,"q":"Що таке рефрактерний шок?","c":"Шок із неадекватною відповіддю на протишокові втручання","w":["Шок, що минув сам без втручань і лікування","Алергічна реакція на препарати крові","Біль у серці"],"e":"Рефрактерний шок — відсутність відповіді на втручання, незадовільна перфузія, гіпотензія, поліорганна недостатність."},{"m":"12","d":2,"q":"Які причини рефрактерного шоку слід розглянути, окрім кровотечі?","c":"Напружений пневмоторакс і серцева тампонада","w":["Лише перегрів і алергія на лікарські засоби","Лише гіпертензія й підвищена температура тіла","Лише алергія"],"e":"Додаткові причини: напружений пневмоторакс (голкова декомпресія) та серцева тампонада; причин може бути кілька одночасно."},{"m":"12","d":3,"q":"Що слід зробити при нерозпізнаному напруженому пневмотораксі, що провокує рефрактерний шок?","c":"Голкова декомпресія","w":["Ще більше рідини","Кисень без голки","Гіпервентиляція"],"e":"Лікування напруженого пневмотораксу — голкова декомпресія; рідини не вирішать причину."},{"m":"12","d":3,"q":"Постраждалий: свідомість відсутня, пульс на радіальній не пальпується, ЧСС 145, ЧД 36. Що це?","c":"Тяжкий геморагічний шок, летальний без негайного втручання","w":["Легка стадія шоку без потреби в негайних діях","Паніка й нормальна відповідь на стрес","Паніка"],"e":"Така картина відповідає 2500 мл втрати: смертельно без негайної допомоги."},{"m":"12","d":2,"q":"Що описує летальну тріаду геморагічного шоку?","c":"Гіпотермія, ацидоз, коагулопатія","w":["Біль, страх, спрага","Алкалоз, гіпертермія, гіпертензія","Тахікардія, гіпоксія, судоми"],"e":"Тріада — гіпотермія, ацидоз та коагулопатія. Профілактика: зупинка кровотечі, зігрівання, продукти крові."},{"m":"12","d":2,"q":"Чи потрібен ВВ доступ усім постраждалим «на випадок погіршення»?","c":"Ні, не кожен поранений потребує ВВ доступу","w":["Так, усім, на випадок погіршення, без показань","Лише тим, хто в броні й має великий зріст","Так, усім"],"e":"Не кожен потребує доступу; його ставлять за показаннями (шок/ризик, ліки)."},{"m":"13","d":1,"q":"Що найкраще запобігає геморагічному шоку?","c":"Зупинка всіх джерел кровотечі","w":["Антибіотики, введені якнайраніше після поранення","Кисень, знеболення та тривала іммобілізація","Кисень"],"e":"Найкраща профілактика шоку — зупинка кровотечі."},{"m":"13","d":2,"q":"Який продукт має найвищий пріоритет при рідинній ресусцитації?","c":"Охолоджена цільна кров","w":["Фізрозчин","Розчин Рінгера","Глюкоза"],"e":"Пріоритет: охолоджена цільна кров, потім перевірена свіжа цільна кров, плазма:еритроцити:тромбоцити 1:1:1, плазма+еритроцити 1:1, окремо плазма чи еритроцити."},{"m":"13","d":2,"q":"Яке співвідношення компонентів крові рекомендоване при збірній трансфузії?","c":"Плазма, еритроцити і тромбоцити у співвідношенні 1:1:1","w":["5:1:1, з акцентом на еритроцити без плазми","1:5:1, із переважанням тромбоцитів над плазмою","5:1:1"],"e":"Рекомендоване співвідношення — 1:1:1 (плазма, еритроцити, тромбоцити)."},{"m":"13","d":1,"q":"За що відповідають еритроцити?","c":"Транспорт кисню до тканин і CO2 назад до легень","w":["Захист від інфекцій і боротьба з бактеріями","Утворення тромбів і запуск згортання крові","Транспорт води"],"e":"Еритроцити переносять кисень і CO2. Лейкоцити — захист, тромбоцити — згортання, плазма — вода, електроліти, фактори зсідання."},{"m":"13","d":1,"q":"За що відповідають тромбоцити?","c":"Ініціюють згортання крові","w":["Транспортують кисень","Борються з вірусами","Переносять гормони"],"e":"Тромбоцити запускають процес згортання крові."},{"m":"13","d":2,"q":"Що є перевагою ліофілізованої плазми (ЛП)?","c":"Може зберігатися без холодильника, входить до набору бойового медика","w":["Потребує обов'язкового холодильника й не придатна до польових умов","Не містить факторів зсідання і є лише розчином води","Потребує холодильника"],"e":"ЛП зберігають без холодильника, вона є в наборі бойового медика, містить фібриноген та фактори зсідання."},{"m":"13","d":2,"q":"Яку систему слід використовувати для ЛП у жорстких контейнерах?","c":"Систему з повітряним клапаном","w":["Стандартну без клапана","Без системи","Будь-яку голку"],"e":"Для скляних/пластикових жорстких контейнерів потрібна система з повітряним клапаном; для еластичних (гемакон) — стандартна."},{"m":"13","d":3,"q":"Які цілі після рідинної ресусцитації?","c":"Пальпується радіальний пульс, покращується свідомість, САТ >100","w":["Максимальний тиск (САТ >150) і нормальна температура рідини","Відсутність пульсу на променевій при САТ 60","САТ >150"],"e":"Цільові показники: радіальний пульс, кращий стан свідомості, САТ >100. «Більше» не означає краще."},{"m":"13","d":2,"q":"Чому надмірна рідинна ресусцитація небезпечна?","c":"Високий тиск може зруйнувати кров'яний згусток","w":["Вона завжди корисна, чим більше, тим краще","Вона розширює зіниці та спричиняє головний біль","Вона посилює голод"],"e":"Надмірний тиск руйнує сформований тромб, також продукти крові — цінний ресурс."},{"m":"13","d":2,"q":"Коли слід припинити рідинну ресусцитацію?","c":"Коли досягнуто мети: пульс на променевій, покращена свідомість, САТ >100","w":["Ніколи не припиняти, доки не закінчаться запаси крові й рідин","Після першої краплі, незалежно від стану пораненого","Ніколи"],"e":"Припиняють при досягненні цілей, щоб не руйнувати згустки."},{"m":"13","d":2,"q":"Які покази для призначення TXA?","c":"Геморагічний шок, підвищений лактат, велика ампутація, проникаюча травма грудної клітки, ознаки великої кровотечі","w":["Головний біль, нежить і біль у горлі без ознак кровотечі","Лише гіпотермія й гіпоглікемія без геморагічного шоку","Нежить"],"e":"TXA показана при геморагічному шоку, підвищеному лактаті, великих ампутаціях, проникаючій травмі грудної клітки та ознаках значної кровотечі."},{"m":"13","d":2,"q":"Яка доза та спосіб введення TXA?","c":"2 г повільно струминно ВВ або ВК (понад 1 хвилини)","w":["1 мг швидким болюсом за 5 секунд ВМ","20 г у вигляді інфузії протягом доби","1 мг"],"e":"TXA — 2 г повільно ВВ/ВК більше 1 хв, якнайшвидше, не пізніше 3 годин від поранення."},{"m":"13","d":2,"q":"У який термін TXA найефективніша?","c":"Не пізніше 3 годин від початку ураження","w":["Через 24 години після поранення, коли стан стабілізується","Через 3 доби, на етапі стаціонарного лікування","Через 3 доби"],"e":"TXA вводять якнайшвидше, не пізніше 3 год після поранення."},{"m":"13","d":2,"q":"Який механізм дії TXA?","c":"Запобігає розпаду кров'яних згустків","w":["Розріджує кров і запобігає утворенню згустків","Стискає судини й підвищує артеріальний тиск","Знеболює"],"e":"TXA — антифібринолітик: запобігає розпаду згустків."},{"m":"13","d":2,"q":"Який єдиний абсолютний протипоказ до TXA?","c":"Попередня алергічна реакція на TXA","w":["Вік пораненого понад 60 років","Гіпотермія й низька температура тіла","Вік"],"e":"Єдиний абсолютний протипоказ — алергія."},{"m":"13","d":3,"q":"Які можливі побічні ефекти TXA?","c":"Розмите бачення, погіршення сприйняття кольорів, нудота, блювання, діарея","w":["Лише головний біль і безсоння тривалістю кілька днів","Тремор, судоми та підвищення температури тіла","Тремор"],"e":"Побічні ефекти тимчасові: затуманення зору, зміна кольорового сприйняття, нудота, блювання, діарея."},{"m":"13","d":2,"q":"До якої температури нагрівають кров перед переливанням?","c":"До 38 °C","w":["До 20 °C","До 50 °C","Не нагрівають"],"e":"Кров нагрівають до 38 °C, щоб запобігти гіпотермії."},{"m":"13","d":2,"q":"Який доступ встановлюють для рідинної ресусцитації?","c":"ВВ або ВК за допомогою катетера 18G","w":["Лише оральний і підшкірний доступ, без ВВ та ВК","Лише ректальний шлях, бо він найшвидший","Лише оральний"],"e":"Встановлюють ВВ чи ВК доступ катетером 18G, профілактика гіпотермії, підготовка препаратів крові."},{"m":"13","d":2,"q":"Які антигени визначають групу крові за системою ABO?","c":"Антигени на поверхні еритроцитів","w":["Антитіла в лімфі та гормони в плазмі","Білки печінки й мінерали в еритроцитах","Гормони"],"e":"Антигени пов'язані з еритроцитами й визначають групу; антитіла — білки плазми, що атакують чужі антигени. Також перевіряють резус-фактор."},{"m":"13","d":2,"q":"Що таке антитіла в контексті груп крові?","c":"Білки плазми, що викликають сильну імунну реакцію на чужі антигени","w":["Клітини крові, що переносять кисень до органів","Гормони, що регулюють згортання без впливу на імунітет","Гормони"],"e":"Антитіла — білки плазми, що реагують на чужі антигени, тому важливий підбір групи крові."},{"m":"13","d":2,"q":"Як працює картка EldonCard?","c":"Кров реагує з антигенами на картці, реакція визначає групу ABO та Rh","w":["Вимірює пульс і артеріальний тиск за допомогою датчика","Нагріває кров до температури тіла перед переливанням","Вимірює тиск"],"e":"На картку нанесено антигени; зсідання/відсутність реакції визначає групу крові ABO та резус."},{"m":"13","d":3,"q":"Які заходи розглядаються для забезпечення крові у польових умовах?","c":"Контейнери з батареями, холодильники у пунктах забезпечення, попередня перевірка донорів, альтернатива охолодженій цільній крові","w":["Лише вода та повітря без жодних технічних засобів","Ніяких заходів не передбачається, використовують лише випадкових донорів","Лише вода"],"e":"Передбачають охолодження, електричні холодильники, заздалегідь перевірених донорів, альтернативу цільній крові."},{"m":"13","d":2,"q":"Що з нижченаведеного НЕ належить до ознак, що показують ефект ресусцитації?","c":"Зниження свідомості","w":["Радіальний пульс","Покращена свідомість","САТ >100"],"e":"Кінцевий стан — пульс на радіальній, покращення свідомості, САТ >100. Зниження свідомості свідчить про погіршення."},{"m":"14","d":1,"q":"У чому різниця між дозою та концентрацією?","c":"Доза — скільки препарату потрібно пораненому, концентрація — скільки препарату в кожному мл","w":["Це одне й те саме: доза дорівнює концентрації","Доза — об'єм ампули, а концентрація — вага пораненого","Це одне й те саме"],"e":"Доза — кількість діючої речовини для пацієнта (наприклад 100 мг). Концентрація — вміст речовини в 1 мл (наприклад 50 мг/мл). Об'єм — скільки рідини набрати."},{"m":"14","d":1,"q":"Що означає запис «50 мг/мл»?","c":"У кожному мілілітрі розчину міститься 50 мг препарату","w":["Усього в ампулі міститься 50 мл розчину","Потрібно ввести 50 мл розчину пораненому","Вводити 50 мл"],"e":"Мг/мл — концентрація: кількість препарату в 1 мл розчину."},{"m":"14","d":1,"q":"Яке правило стосується десяткових дробів при записі дози?","c":"Писати нуль перед комою (0,3 мл), ніколи не писати «.3 мл»","w":["Писати без нуля (.3 мл), бо так швидше","Не вказувати одиниці вимірювання, бо це зрозуміло з контексту","Писати без нуля"],"e":"Нуль перед десятковою комою запобігає десятикратним помилкам; також голосно промовляйте одиницю та перевіряйте, чи відповідь має сенс."},{"m":"14","d":1,"q":"Що перевіряють перед введенням препарату за правилом «правильно» (модуль 14)?","c":"Пацієнт, препарат, форма, концентрація, доза, шлях, час","w":["Лише препарат і пацієнта, решта не потребує перевірки","Лише дозу та час, шлях введення не має значення","Лише час"],"e":"Перевіряють: правильний пацієнт, препарат, форма, концентрація, доза, шлях введення, час. Якщо щось викликає сумніви — зупиніться й перевірте."},{"m":"14","d":2,"q":"Яка помилка з одиницями вимірювання наведена як поширена та небезпечна?","c":"2 г — це 2000 мг, а не 200 мг","w":["1 г — це 100 мг, а 1 мг — це 100 мкг","1 л — це 100 мл, а 1 мл — це 10 крапель","1 г — це 100 мг"],"e":"2 г = 2000 мг. Помилка в 10 разів може бути смертельною."},{"m":"14","d":2,"q":"Що НЕ можна переводити між одиницями?","c":"МО (міжнародні одиниці)","w":["Грами в міліграми","Літри в мілілітри","Мікрограми в міліграми"],"e":"МО (одиниці) не конвертують у мг; вони специфічні для кожного препарату."},{"m":"14","d":2,"q":"Що не слід плутати при розрахунках?","c":"Об'єм ампули з концентрацією препарату","w":["Лише колір ампули та ціну препарату","Лише виробника препарату й розмір шприца","Лише ціну"],"e":"Об'єм ампули ≠ концентрація. Ампула 5 мл не завжди містить 500 мг — завжди читайте етикетку."},{"m":"14","d":2,"q":"Що змінюють 10, 15, 20 або 60 крапель/мл?","c":"Розрахунок швидкості крапельного введення","w":["Дозу препарату та його концентрацію в розчині","Шлях введення препарату та час його дії","Концентрацію"],"e":"Крапельний фактор залежить від системи та змінює кількість крапель/хв при тому самому об'ємі."},{"m":"14","d":2,"q":"Яке правило маркування шприца?","c":"Назва препарату, концентрація, доза/об'єм, час підготовки та ініціали","w":["Лише ініціали та час, решту не вказують","Не маркують, якщо шприц набраний щойно й одразу вводиться","Лише час"],"e":"Маркують усі підготовлені шприци: препарат, концентрація, доза/об'єм, час і ініціали; немаркований шприц створює ризик помилки."},{"m":"14","d":2,"q":"Який шприц обирають для точного відміряння малої дози?","c":"Найменший шприц, що дозволяє точно відміряти дозу","w":["Найбільший доступний шприц, щоб менше робити рухів","Будь-який шприц без поділок, бо об'єм не важливий","Будь-який"],"e":"Використовують найменший придатний шприц; 0,3 мл не набирають у великий."},{"m":"14","d":2,"q":"Що робити перед розрахунком дози сухого препарату?","c":"Спочатку відновити (розчинити), потім рахувати за концентрацією готового розчину","w":["Розрахувати за сухою вагою порошку й додати воду навмання","Нічого не розраховувати, лише відкрити флакон і набрати все","Нічого не робити"],"e":"Для сухих препаратів: відновити, потім розрахувати дозу за концентрацією готового розчину. Ніколи не визначайте об'єм розчинника навмання."},{"m":"14","d":3,"q":"Яка послідовність безпечного введення?","c":"Розрахунок → взаємна перевірка → набір → маркування → фінальна перевірка","w":["Набір → введення → розрахунок → маркування","Маркування без розрахунку → введення без перевірки","Введення без перевірки"],"e":"Порядок безпеки: розрахунок, взаємна перевірка, набір препарату, маркування, фінальна перевірка."},{"m":"15","d":1,"q":"Що таке тупа ЧМТ?","c":"Закрита травма: мозок ушкоджується всередині черепа від удару чи вибухової хвилі","w":["Куля або уламок пробиває череп, мозок ушкоджується відкрито","Забій шкіри на обличчі без ушкодження мозку","Куля в голові"],"e":"Тупа (закрита) ЧМТ — череп не пробито. Проникаюча (відкрита) — череп пробивається кулею, уламком, ножем."},{"m":"15","d":2,"q":"Що таке первинна травма мозку?","c":"Негайне ушкодження в момент травми","w":["Ушкодження через гіпоксію через години","Набряк мозку","Підвищений тиск"],"e":"Первинна ушкодження — у момент удару; вторинне (гіпоксія, гіпотензія, підвищений ВЧТ, набряк) розвивається згодом."},{"m":"15","d":2,"q":"Що з переліченого — приклад вторинного ушкодження мозку?","c":"Гіпоксія, гіпотензія, підвищений внутрішньочерепний тиск, набряк","w":["Перелом черепа та рана шкіри голови в момент удару","Синці за вухами та під очима як безпосередній результат удару","Рана шкіри"],"e":"Вторинні ушкодження виникають після травми, їх можна запобігти підтримкою кисню й тиску."},{"m":"15","d":2,"q":"Який механізм вважається ризиком ЧМТ при вибуху?","c":"Перебування в межах 50 метрів від вибуху","w":["Перебування за 500 метрів від вибуху в укритті","Лише прямий удар у голову без вибухових факторів","Лише стрілянина"],"e":"Ризик ЧМТ — у межах 50 м від вибуху будь-якого типу, ДТП, прямий удар, вогнепальне/осколкове поранення голови."},{"m":"15","d":2,"q":"Що таке синдром Баттла?","c":"Синці за вухами","w":["Синці під очима","Розширення зіниць","Витікання ліквору з носа"],"e":"Синдром Баттла — синці за вухами; «очі єнота» — синці навколо очей. Обидва — ознаки перелому основи черепа."},{"m":"15","d":2,"q":"Що таке «очі єнота»?","c":"Синці під очима при ЧМТ","w":["Блискучі очі","Звужені зіниці","Червоні очі від диму"],"e":"«Очі єнота» — периорбітальні синці, ознака перелому основи черепа."},{"m":"15","d":2,"q":"Які ознаки легкої ЧМТ (струсу)?","c":"Короткочасна втрата свідомості до 30 хв, головний біль, дзвін у вухах, нудота, запаморочення, втрата пам'яті до 24 год","w":["Втрата свідомості понад 24 години й амнезія понад 7 днів","Сплутаність понад 24 години й кома без реакції на біль","Кома"],"e":"Легка ЧМТ: свідомість зберігається чи втрата від секунд до 30 хв; симптоми — головний біль, дзвін, нудота, сплутаність, амнезія <24 год."},{"m":"15","d":2,"q":"Яка тривалість втрати свідомості при ЧМТ середнього ступеня?","c":"Понад 30 хв, але менше 24 год","w":["Секунди або до 30 хвилин без наслідків для пам'яті","Понад 24 години з амнезією понад 7 днів","Секунди"],"e":"Середня: втрата свідомості >30 хв, <24 год; амнезія >24 год, <7 днів. Важка — >24 год втрати свідомості, амнезія >7 днів."},{"m":"15","d":1,"q":"Що означає AVPU?","c":"Ясна свідомість, реагує на голос, на біль, не реагує","w":["Артерія, вена, пульс, тиск","Повітря, вентиляція, пульс, ультразвук","Антибіотик, вода, паста, укол"],"e":"AVPU: A — alert, V — voice, P — pain, U — unresponsive; ще позначають сплутану свідомість."},{"m":"15","d":2,"q":"Що означає HEADS в оцінці ТОВ?","c":"Головний біль/блювота, дзвін у вухах, амнезія/втрата свідомості, двоїння/запаморочення, відчуття, що щось не так","w":["Голод, втома, апетит, сонливість та спрага","Біль у животі, кашель, висип і підвищена температура","Перелом"],"e":"HEADS: Headache/vomiting, Ears ringing, Amnesia/LOC, Double vision/dizziness, Something is wrong. Використовується в оцінці після вибуху."},{"m":"15","d":3,"q":"Що означає ТОВ для постраждалого з підозрою на ЧМТ?","c":"Травма, Оцінка, Відстань (від вибуху)","w":["Тиск, Оцінка, Вага","Турнікет, Ожиріння, Варіка","Температура, Огляд, Відновлення"],"e":"ТОВ — інструмент скринінгу: Травма (фізичне ушкодження), Оцінка (симптоми HEADS), Відстань від епіцентру вибуху."},{"m":"15","d":2,"q":"Як лікують легку ЧМТ?","c":"Спокій, мінімізація подразників, стеження за свідомістю","w":["Інтенсивна терапія, хірургія та гіпервентиляція в усіх випадках","Активні ігри та яскраве світло для швидшого відновлення","Хірургія"],"e":"При легкій ЧМТ — спокій, зменшення зовнішніх подразників і спостереження."},{"m":"15","d":2,"q":"Яку сатурацію слід підтримувати при ЧМТ середнього і тяжкого ступеня?","c":"Понад 92 %","w":["Понад 60 %","Понад 75 %","Менше 90 %"],"e":"При ЧМТ контролюють SpO2 >92 %, за можливості — додатковий кисень."},{"m":"15","d":3,"q":"Який цільовий систолічний тиск при ЧМТ середнього та тяжкого ступеня?","c":"Понад 100 мм рт. ст.","w":["Понад 200","Менше 90","Рівно 60"],"e":"Підтримують САТ >100 мм рт. ст. й пульс на променевій артерії."},{"m":"15","d":2,"q":"Яка доза мідазоламу при судомах у ЧМТ?","c":"10 мг внутрішньом'язово","w":["1 мг ВВ","100 мг ВМ","0,1 мг ВМ"],"e":"При судомах — мідазолам 10 мг ВМ. Не плутайте з седацією 1 мг ВВ/ВК."},{"m":"15","d":2,"q":"Яке положення надають пораненому з ЧМТ на ношах?","c":"Підняти голову на 30°","w":["Опустити голову","Покласти на живіт","Покласти ноги догори"],"e":"Підняття частини носилок з головою на 30° допомагає знизити ВЧТ."},{"m":"15","d":2,"q":"Як часто контролюють стан при ЧМТ середньої/важкої?","c":"Кожні 10 хвилин","w":["Раз на добу","Раз на годину","Не контролюють"],"e":"Контроль і перевірка кожні 10 хвилин; стежать за свідомістю, зіницями, САТ, SpO2."},{"m":"15","d":3,"q":"Як накривають відкриту проникаючу рану голови?","c":"Стерильною пов'язкою, бажано вологою, без прямого тиску, забинтувати не надто туго","w":["Тугою тиснучою пов'язкою з сильним тиском на рану","Залити спиртом і залишити відкритою без пов'язки","Не накривати"],"e":"Проникаючі рани накривають стерильною (вологою) пов'язкою, не здійснюють прямого тиску й бинтують не туго."},{"m":"15","d":2,"q":"Що робити зі стороннім предметом, що стирчить з голови?","c":"Не видаляти, створити підтримувальну конструкцію й зафіксувати бинтом","w":["Негайно витягнути предмет і притиснути рану до черепа","Відламати частину предмета й накрити сухим бинтом","Відламати"],"e":"Предмет не видаляють; навколо створюють підтримку і фіксують, щоб запобігти зміщенню."},{"m":"15","d":2,"q":"Що відбувається з внутрішньочерепним тиском при кровотечі й набряку?","c":"Підвищується, бо череп — закрита структура","w":["Знижується, бо мозок стискається й зменшується в об'ємі","Не змінюється, бо череп повністю компенсує будь-який набряк","Знижується"],"e":"Черепна коробка закрита: кров чи набряк підвищують ВЧТ; коли компенсація вичерпана — вклинення мозку."},{"m":"15","d":3,"q":"Які ознаки загрози вклинення головного мозку?","c":"Одностороннє розширення зіниці, зниження свідомості, високий АТ, повільний пульс, нерівномірне дихання","w":["Звужені зіниці, тахікардія та нормальне дихання","Лише головний біль без змін свідомості та зіниць","Нормальне дихання"],"e":"Вклинення: фіксована розширена зіниця, зниження свідомості, гіпертензія, брадикардія, патологічне дихання (тріада Кушинга)."},{"m":"15","d":2,"q":"Що робити при ознаках загрози вклинення?","c":"250 мл гіпертонічного розчину ВВ/ВК, підняти голову на 30°, за потреби гіпервентиляція","w":["Дати воду й покласти пораненого головою вниз","Лише знеболити й залишити лежати без втручань","Нічого"],"e":"При вклиненні: 250 мл гіпертонічного розчину, голова під кутом 30°, гіпервентиляція (20 вдихів/хв, максимальний кисень) — лише при ознаках вклинення."},{"m":"15","d":3,"q":"Коли проводять гіпервентиляцію при ЧМТ?","c":"Лише за ознак загрози вклинення","w":["Завжди при будь-якій ЧМТ для профілактики набряку","Ніколи, навіть при вклиненні мозку","Завжди"],"e":"Не проводьте гіпервентиляцію без ознак вклинення — вона знижує церебральний кровотік і погіршує стан."},{"m":"15","d":3,"q":"Скільки вдихів на хвилину при гіпервентиляції за загрози вклинення?","c":"20","w":["5","40","Не обмежено"],"e":"Гіпервентиляція — 20 вдихів/хв при найвищій можливій концентрації кисню."},{"m":"15","d":2,"q":"Коли слід запідозрити травму хребта?","c":"Травма голови чи обличчя, непритомність, вибух/падіння, біль у шиї, неможливість рухати кінцівками, порушення чутливості","w":["Лише при кашлі, нежитю та болю в горлі","Лише при опіку шкіри та пораненні стопи","Лише при кашлі"],"e":"Критерії: травма голови/обличчя, змінена свідомість, високоенергетичний механізм, неврологічні скарги."},{"m":"15","d":2,"q":"Яка послідовність іммобілізації шийного відділу від «добре» до «найкраще»?","c":"Добре — імпровізований комір, краще — блокування голови, найкраще — ручна стабілізація","w":["Добре — ручна стабілізація, краще — імпровізований комір","Усі способи рівнозначні, окрім блокування голови","Лише коміри"],"e":"Добре: імпровізований комір; краще: блокування голови (скручені рушники); найкраще: ручна стабілізація (потрібні двоє)."},{"m":"15","d":3,"q":"Що означає «поганий комір гірший, ніж його відсутність»?","c":"Некоректна іммобілізація шкодить; не зволікайте із заходами, що рятують життя","w":["Коміри ніколи не потрібні в польових умовах","Коміри завжди ом 400 мл/год."},{"m":"22","d":3,"q":"Опік 70% ЗППТ, маса пораненого 80 кг. Яка початкова швидкість ВВ/ВК інфузії за правилом десяток?","c":"700 мл/год","w":["7000 мл/год","70 мл/год","800 мл/год"],"e":"40-80 кг: % ЗППТ × 10 мл/год = 70 × 10 = 700 мл/год."},{"m":"22","d":3,"q":"Опік 18% ЗППТ (2-3 ст.). Яка перша дія щодо охолодження, якщо ситуація дозволяє?","c":"Охолодити водою ~20 °C протягом 20 хв (площа не перевищує 20 %)","w":["Не охолоджувати, бо це завжди викликає гіпотермію","Охолоджувати льодом протягом 60 хвилин","Охолоджувати льодом 60 хв"],"e":"Правило «20-20-20»: вода ~20 °C, 20 хв, площа не більше 20 % ЗППТ. Для більших опіків охолодження ризикує спричинити гіпотермію."},{"m":"22","d":3,"q":"Опік 15% ЗППТ у притомного. Чи починають масивну рідинну ресусцитацію за правилом десяток?","c":"Ні, рідинну ресусцитацію розпочинають при опіках >20 % ЗППТ","w":["Так, рідинну ресусцитацію розпочинають при будь-якому опіку","Так, якщо площа перевищує 5 %","Лише після 24 годин"],"e":"Рідинну ресусцитацію при опіках розпочинають при >20 % ЗППТ після встановлення ВВ/ВК доступу."},{"m":"22","d":2,"q":"До якої площі опіку можна розглянути пероральні рідини, якщо постраждалий при свідомості й може ковтати?","c":"До 30 % ЗППТ","w":["До 5 % ЗППТ","До 60 % ЗППТ","Без обмежень"],"e":"При опіках до 30 % ЗППТ у притомного, що ковтає, розглядають пероральні рідини; при більших опіках — ВВ/ВК за правилом десяток."},{"m":"06","d":1,"q":"Що означає MARCH PAWS?","c":"Алгоритм пріоритетів: Massive hemorrhage, Airway, Respiration, Circulation, Head/Hypothermia; потім Pain, Antibiotics, Wounds, Splinting","w":["Перелік ліків, що вводять при кровотечі","Порядок евакуації поранених між етапами","Перелік ліків"],"e":"MARCH — загрозливі для життя стани (кровотеча, дихальні шляхи, дихання, кровообіг, голова/гіпотермія), PAWS — подальша допомога: біль, антибіотики, рани, шини."},{"m":"06","d":2,"q":"Яка послідовність пріоритетів MARCH правильна?","c":"Кровотеча → дихальні шляхи → дихання → кровообіг → голова/гіпотермія","w":["Дихальні шляхи → дихання → кровотеча → кровообіг","Дихання → кровообіг → кровотеча → голова","Дихання → кровообіг → кровотеча"],"e":"Спочатку масивна кровотеча (M), потім A, R, C, H."},{"m":"06","d":3,"q":"Яка помилка при самодопомозі є небезпечною в CUF?","c":"Витрачати час на детальний огляд і лікування під вогнем","w":["Накласти турнікет високо й туго","Перейти в укриття й відкрити вогонь у відповідь","Перейти в укриття"],"e":"Під вогнем дії мінімальні: укриття, відповідь, швидкий турнікет. Детальна допомога — у TFC."},{"m":"07","d":3,"q":"Постраждалий без свідомості лежить на спині, хрипить, є кров у роті. Що першим?","c":"Очистити видимі рідини відсмоктуванням, виконати виведення нижньої щелепи, розглянути NPA","w":["Нічого не робити, чекати пробудження","Покласти на живіт і дати пити воду","Дати пити"],"e":"Спершу видалити видиме (відсмоктування), відновити прохідність маневром, далі NPA/стабільне положення."},{"m":"07","d":2,"q":"Що правильно щодо крікотиреотомії та інгаляційного опіку?","c":"При ознаках інгаляційних опіків чи токсичних газів уникають NPA/OPA і виконують крікотиреотомію","w":["Завжди ставити NPA, ніколи не виконувати крікотиреотомію","Завжди ставити OPA і не оцінювати дихальні шляхи","Завжди NPA"],"e":"Опіки або токсичні гази — додаткові показання до крікотиреотомії."},{"m":"08","d":3,"q":"Яка послідовність дій профілактики гіпотермії?","c":"Зупинити кровотечу, замінити мокрий одяг, ізолювати, активне зігрівання за наявності, гідроізоляція зверху","w":["Лише гаряча вода й гаряче пиття","Лише теплий одяг без зупинки кровотечі","Нічого"],"e":"Рішучі ранні заходи: джерело тепла, ізоляція від землі, пасивні та активні методи, гідроізоляційна оболонка."},{"m":"08","d":2,"q":"Чому гіпотермія називається «незалежним предиктором смертності»?","c":"Вона підвищує смертність у травмованих незалежно від інших факторів","w":["Вона не впливає на смертність","Вона зменшує смертність у травмованих","Вона нешкідлива"],"e":"Підсумок курсу: гіпотермія — незалежний предиктор смертності при травмі."},{"m":"10","d":3,"q":"Яка послідовність дій при відкритому пневмотораксі?","c":"Закрити рану рукою в рукавичці, накласти наліпку з клапаном, стежити за станом","w":["Залишити рану відкритою й розпочати інфузію","Затампонувати рану й накласти тугу пов'язку","Накласти турнікет"],"e":"Рука → наліпка (вент) → спостереження; при погіршенні — випустити повітря/NDC."},{"m":"10","d":2,"q":"Яка ознака вказує, що зараз потрібна не наліпка, а голкова декомпресія?","c":"Напружений пневмоторакс: прогресуюча дихальна недостатність, відсутні дихальні шуми на одному боці, SpO2 <90 %","w":["Поверхневе садно та легкий кашель без зниження сатурації","Біль у плечі та нудота без дихальної недостатності","Біль у плечі"],"e":"Ознаки напруженого пневмотораксу — показання до NDC."},{"m":"11","d":3,"q":"У якому порядку діють при зовнішній кровотечі за прогресивною стратегією?","c":"Розкрити рани, переглянути турнікети, за потреби перемістити/конвертувати, оцінити таз та шок","w":["Лише переливання, антибіотики та знеболення","Лише тампонування без огляду та оцінки одягу","Лише знеболення"],"e":"Прогресивна стратегія — послідовна переоцінка кровотечі та турнікетів, потім таз і шок."},{"m":"11","d":2,"q":"Що робити першим, якщо турнікет накладений поверх уніформи й кровотеча зупинена?","c":"Розкрити рану й оцінити, чи турнікет показаний; при потребі виконати переміщення на 5-8 см над раною","w":["Нічого, залишити турнікет назавжди на одязі","Зняти без контролю й накласти знову нижче","Зняти одразу без нагляду"],"e":"Турнікет на одязі — показання до переміщення (прицільного перенакладання), якщо немає протипоказань."},{"m":"12","d":3,"q":"Які показники в польових умовах свідчать про початок рідинної ресусцитації?","c":"Змінена свідомість та слабкий чи відсутній пульс на променевій артерії","w":["Нормальний пульс і ясна свідомість","Біль у горлі та нежить без шоку","Кашель"],"e":"Ознаки геморагічного шоку: свідомість та радіальний пульс — основа рішення."},{"m":"13","d":2,"q":"Що з переліченого є метою лікування геморагічного шоку в TFC?","c":"Зупинити кровотечу, відновити перфузію продуктами крові, запобігти гіпотермії, ацидозу","w":["Максимальний тиск і швидка інфузія води","Лише знеболення й антибіотики без кровотечі","Лише холодні рідини"],"e":"Мета — відновлення перфузії без руйнування згустків: кров, TXA, зігрівання."},{"m":"13","d":3,"q":"Чому охолоджена цільна кров — найкращий вибір?","c":"Містить усі компоненти крові у природному співвідношенні","w":["Дешевша, не потребує групи й зберігається при кімнатній температурі","Містить лише воду та електроліти без клітин","Дешевша"],"e":"Цільна кров одночасно відновлює об'єм, кисневу ємність та фактори зсідання."},{"m":"14","d":2,"q":"Що означає скорочення ВМ у шляхах введення?","c":"Внутрішньом'язово","w":["Внутрішньовенно","Внутрішньокістково","Підшкірно"],"e":"ВМ — внутрішньом'язово; ВВ — внутрішньовенно; ВК — внутрішньокістково; ІН — інтраназально; ПО — преорально; ПШ — підшкірно; ТР — трансмукозно."},{"m":"14","d":2,"q":"Що означає скорочення ІН?","c":"Інтраназально","w":["Інгаляційно","Інфузійно","Інтраокулярно"],"e":"ІН — інтраназальний шлях (через ніс)."},{"m":"14","d":2,"q":"Яка помилка з десятковою комою є небезпечною?","c":"Прочитати 0,3 мл як 3 мл (в 10 разів більше)","w":["Писати 0,3 мл з нулем перед комою","Промовляти одиницю вимірювання вголос","Писати 0,3 мл"],"e":"0,3 мл ≠ 3 мл: ризик десятикратної передозування. Нуль перед комою обов'язковий."},{"m":"14","d":2,"q":"Що має містити маркування шприца?","c":"Назва препарату, концентрація, доза/об'єм, час та ініціали","w":["Лише колір препарату та ціна","Лише ініціали, решта не потрібна","Нічого"],"e":"Усі підготовлені шприци маркують."},{"m":"14","d":3,"q":"Для чого потрібна взаємна перевірка?","c":"Перевірити розрахунок, маркування і об'єм у шприці другою людиною","w":["Для швидкості й краси оформлення","Не потрібна взагалі","Для краси"],"e":"Взаємна перевірка зменш антибіотик вибору за оновленими настановами."}];
const MOD = {"06":"Масивна кровотеча","07":"Дихальні шляхи","08":"Гіпотермія та поводження","10":"Дихання","11":"Кровообіг","12":"Шок","13":"Рідинна ресусцитація","14":"Розрахунок ліків","15":"Травма голови","16":"Травма ока","19":"Знеболення","20":"Антибіотики","21":"Рани","22":"Опіки"};
const DIFF = {1:"Просте",2:"Середнє",3:"Складне"};
const KEY = "tccc_quiz_v1";
let store = {stats:{}, session:null, prefs:{mode:"easy",count:0,mod:"all",onlyWrong:false}};
function load(){try{const s=localStorage.getItem(KEY);if(s){const o=JSON.parse(s);store=Object.assign(store,o);store.prefs=Object.assign({mode:"easy",count:0,mod:"all",onlyWrong:false},o.prefs||{})}}catch(e){}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(store))}catch(e){}}
load();
const $app=document.getElementById("app");
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const LET=["А","Б","В","Г"];

function totals(){let ok=0,bad=0;for(const k in store.stats){ok+=store.stats[k].ok||0;bad+=store.stats[k].bad||0}return{ok,bad,seen:Object.keys(store.stats).length}}

function home(){
  const t=totals(), p=store.prefs, s=store.session;
  const wrongIds=Object.keys(store.stats).filter(k=>store.stats[k].last===0).length;
  let h=`<h1>TCCC · Тест на ${Q.length} питань</h1><p class="sub">Працює офлайн. Відповідь підсвічується одразу, а при помилці пояснюється, чому.</p>`;
  h+=`<div class="panel"><h2>Ваш прогрес</h2><div class="stats"><div><b>${t.seen}</b><span>з ${Q.length} пройдено</span></div><div><b>${t.ok+t.bad?Math.round(100*t.ok/(t.ok+t.bad)):0}%</b><span>правильних</span></div><div><b>${wrongIds}</b><span>у помилках</span></div></div></div>`;
  if(s&&s.pos<s.order.length){h+=`<div class="panel"><button class="btn" id="resume">Продовжити (${s.pos}/${s.order.length})</button></div>`}
  h+=`<div class="panel"><h2>Порядок</h2><div class="row"><button class="chip ${p.mode==="easy"?"on":""}" data-mode="easy">Від простого до складного</button><button class="chip ${p.mode==="rand"?"on":""}" data-mode="rand">В розкидку</button></div></div>`;
  h+=`<div class="panel"><h2>Кількість питань</h2><div class="row">${[[0,"Усі "+Q.length],[100,"100"],[50,"50"],[20,"20"]].map(([n,l])=>`<button class="chip ${p.count===n?"on":""}" data-count="${n}">${l}</button>`).join("")}</div></div>`;
  h+=`<div class="panel"><h2>Тема</h2><select id="mod"><option value="all">Усі теми</option>${Object.keys(MOD).map(k=>`<option value="${k}" ${p.mod===k?"selected":""}>Модуль ${k} — ${MOD[k]} (${Q.filter(q=>q.m===k).length})</option>`).join("")}</select>
  <label style="display:flex;gap:10px;align-items:center;margin-top:12px;min-height:44px"><input type="checkbox" id="onlyw" ${p.onlyWrong?"checked":""} style="width:22px;height:22px"> Лише питання, де були помилки (${wrongIds})</label></div>`;
  h+=`<button class="btn" id="start">Почати тест</button>`;
  h+=`<p style="text-align:center;margin-top:14px"><button class="btn sec" id="reset" style="min-height:44px;font-size:.9rem">Скинути прогрес</button></p>`;
  $app.innerHTML=h;
  $app.querySelectorAll("[data-mode]").forEach(b=>b.onclick=()=>{p.mode=b.dataset.mode;save();home()});
  $app.querySelectorAll("[data-count]").forEach(b=>b.onclick=()=>{p.count=+b.dataset.count;save();home()});
  $app.querySelector("#mod").onchange=e=>{p.mod=e.target.value;save()};
  $app.querySelector("#onlyw").onchange=e=>{p.onlyWrong=e.target.checked;save()};
  const r=$app.querySelector("#resume");if(r)r.onclick=()=>quiz();
  $app.querySelector("#start").onclick=startNew;
  $app.querySelector("#reset").onclick=()=>{if(confirm("Скинути весь прогрес?")){store.stats={};store.session=null;save();home()}};
}

function startNew(){
  const p=store.prefs;
  let ids=Q.map((q,i)=>i);
  if(p.mod!=="all")ids=ids.filter(i=>Q[i].m===p.mod);
  if(p.onlyWrong)ids=ids.filter(i=>store.stats[i]&&store.stats[i].last===0);
  if(!ids.length){alert("Немає питань за цими умовами.");return}
  if(p.mode==="easy"){
    const by={1:[],2:[],3:[]};ids.forEach(i=>by[Q[i].d].push(i));
    if(p.count){ // рівномірно з кожного рівня зберігаючи градацію
      let pick=[];const tot=ids.length;
      for(const d of [1,2,3]){const n=Math.round(p.count*by[d].length/tot);pick.push(...shuffle(by[d]).slice(0,n))}
      ids=pick;const by2={1:[],2:[],3:[]};ids.forEach(i=>by2[Q[i].d].push(i));ids=[...shuffle(by2[1]),...shuffle(by2[2]),...shuffle(by2[3])];
    }else ids=[...shuffle(by[1]),...shuffle(by[2]),...shuffle(by[3])];
  }else{ids=shuffle(ids);if(p.count)ids=ids.slice(0,p.count)}
  store.session={order:ids,pos:0,ok:0,bad:0,wrongList:[]};save();quiz();
}

function quiz(){
  const s=store.session;if(!s){home();return}
  if(s.pos>=s.order.length){results();return}
  const id=s.order[s.pos],q=Q[id];
  const opts=shuffle([{t:q.c,c:true},...q.w.map(t=>({t,c:false}))]);
  let answered=false;
  let h=`<div class="top"><button class="x" id="exit" aria-label="Меню">✕</button><div class="bar"><i style="width:${100*s.pos/s.order.length}%"></i></div><div class="cnt">${s.pos+1}/${s.order.length}</div></div>`;
  h+=`<div class="tags"><span class="tag">Модуль ${q.m} · ${MOD[q.m]}</span><span class="tag">${"●".repeat(q.d)}${"○".repeat(3-q.d)} ${DIFF[q.d]}</span><span class="tag">✓ ${s.ok} · ✗ ${s.bad}</span></div>`;
  h+=`<div class="q">${esc(q.q)}</div><div class="seg" id="opts">${opts.map((o,i)=>`<button class="opt" data-i="${i}"><span class="k">${LET[i]}</span><span class="t">${esc(o.t)}</span></button>`).join("")}</div><div id="fb"></div><div class="dock hide" id="dock"><div class="in"><button class="btn" id="next">Далі →</button></div></div>`;
  $app.innerHTML=h;window.scrollTo(0,0);
  $app.querySelector("#exit").onclick=()=>{home()};
  const btns=[...$app.querySelectorAll(".opt")];
  function choose(i){
    if(answered)return;answered=true;
    const o=opts[i];const st=store.stats[id]||(store.stats[id]={ok:0,bad:0});
    btns.forEach((b,k)=>{b.disabled=true;if(opts[k].c)b.classList.add("ok");else if(k===i)b.classList.add("bad");else b.classList.add("dim")});
    let fb;
    if(o.c){s.ok++;st.ok++;st.last=1;
      fb=`<div class="fb ok"><h3>✅ Правильно!</h3><p>${esc(q.e)}</p></div>`;
    }else{s.bad++;st.bad++;st.last=0;s.wrongList.push(id);
      fb=`<div class="fb bad"><h3>❌ Неправильно</h3><p><b>Ви обрали:</b> «${esc(o.t)}» — це хибна відповідь.</p><p><b>Правильно:</b> «${esc(q.c)}»</p><p><b>Чому так:</b> ${esc(q.e)}</p></div>`;
    }
    $app.querySelector("#fb").innerHTML=fb;
    const dock=$app.querySelector("#dock");dock.classList.remove("hide");
    $app.querySelector("#next").textContent=s.pos+1>=s.order.length?"Результат →":"Далі →";
    $app.querySelector("#next").onclick=()=>{s.pos++;save();quiz()};
    save();
    setTimeout(()=>{$app.querySelector("#fb").scrollIntoView({behavior:"smooth",block:"nearest"})},50);
  }
  btns.forEach((b,i)=>b.onclick=()=>choose(i));
  window.onkeydown=e=>{
    if(e.key>="1"&&e.key<="4"){const i=+e.key-1;if(btns[i])choose(i)}
    else if((e.key==="Enter"||e.key===" ")&&answered){e.preventDefault();const n=$app.querySelector("#next");if(n)n.click()}
  };
}

function results(){
  const s=store.session,n=s.order.length,pc=Math.round(100*s.ok/n);
  const bym={};s.order.forEach(id=>{const m=Q[id].m;bym[m]=bym[m]||{n:0,w:0}; bym[m].n++});
  s.wrongList.forEach(id=>{bym[Q[id].m].w++});
  let h=`<h1>Результат</h1><div class="panel"><div class="big">${pc}%</div><p style="text-align:center;margin:0">Правильно ${s.ok} із ${n}, помилок ${s.bad}</p></div>`;
  h+=`<div class="panel"><h2>За темами</h2><table class="tbl">${Object.keys(bym).sort().map(m=>`<tr><td>${m} · ${MOD[m]}</td><td>${bym[m].n-bym[m].w}/${bym[m].n}</td></tr>`).join("")}</table></div>`;
  h+=`<button class="btn" id="again">Нова спроба</button>`;
  if(s.wrongList.length)h+=`<button class="btn sec" id="wrong" style="margin-top:10px">Повторити помилки (${s.wrongList.length})</button>`;
  h+=`<button class="btn sec" id="menu" style="margin-top:10px">У меню</button>`;
  $app.innerHTML=h;window.scrollTo(0,0);window.onkeydown=null;
  $app.querySelector("#again").onclick=startNew;
  $app.querySelector("#menu").onclick=()=>{store.session=null;save();home()};
  const w=$app.querySelector("#wrong");if(w)w.onclick=()=>{store.session={order:shuffle([...new Set(s.wrongList)]),pos:0,ok:0,bad:0,wrongList:[]};save();quiz()};
}
home();
</script>
</body>
</html>
